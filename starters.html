<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Hotel Tulsi | Starter Section</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <meta name="description" content="Order from our premium starter menu at Hotel Tulsi."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --gold-100: #fff9ed;
      --gold-200: #fef3c7;
      --gold-300: #f5d48a;
      --gold-400: #e8c56a;
      --gold-500: #d4a832;
      --gold-600: #b8901e;
      --stone-950: #080500;
      --gold-glow: rgba(212,168,50,.55);
      --ff-serif:  'Playfair Display', Georgia, serif;
      --ff-cinzel: 'Cinzel', 'Times New Roman', serif;
      --ff-body:   'Inter', 'Helvetica Neue', sans-serif;
      --ease-out:    cubic-bezier(.22,1,.36,1);
      --ease-bounce: cubic-bezier(.34,1.56,.64,1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: var(--ff-body);
      color: #fff;
      background: var(--stone-950);
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── FIXED BG ── */
    .bg {
      position: fixed; inset: 0; z-index: 0; overflow: hidden;
      pointer-events: none;
    }
    .bg img {
      width: 100%; height: 100%; object-fit: cover;
      filter: brightness(.2) saturate(.6);
      animation: bgZoom 35s ease-in-out infinite alternate;
    }
    @keyframes bgZoom { from { transform: scale(1); } to { transform: scale(1.07); } }
    .bg-grad {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 45% at 50% 0%, rgba(180,130,20,.22) 0%, transparent 70%),
        linear-gradient(to bottom, rgba(8,5,0,.6) 0%, rgba(6,4,0,.3) 30%, rgba(4,3,0,.85) 100%);
    }

    /* ── PARTICLES ── */
    .particles { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
    .particle {
      position: absolute; border-radius: 50%;
      background: var(--gold-300); opacity: 0;
      animation: floatUp var(--dur,10s) var(--delay,0s) ease-in infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) scale(1); opacity: 0; }
      8%   { opacity: .35; }
      85%  { opacity: .07; }
      100% { transform: translateY(-105vh) scale(.15); opacity: 0; }
    }

    /* ── TOPBAR ── */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      padding: .75rem 1.2rem;
      display: flex; align-items: center; gap: 1rem;
      background: rgba(8,5,0,.82);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(212,168,50,.18);
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: .4rem;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16);
      color: rgba(255,255,255,.7); font-family: var(--ff-body); font-size: .8rem;
      letter-spacing: .05em; padding: .45rem 1rem; border-radius: 100px;
      cursor: pointer; backdrop-filter: blur(10px); transition: .25s ease;
      text-decoration: none; flex-shrink: 0;
    }
    .back-btn:hover { background: rgba(212,168,50,.18); color: var(--gold-300); border-color: rgba(212,168,50,.4); }
    .back-arrow { font-size: 1rem; line-height: 1; }
    .topbar-title {
      flex: 1; text-align: center;
      font-family: var(--ff-cinzel); font-size: clamp(.95rem, 3.5vw, 1.3rem);
      font-weight: 700; letter-spacing: .18em;
      background: linear-gradient(135deg, var(--gold-300), var(--gold-500), var(--gold-200));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: none;
    }
    /* spacer to balance the back button */
    .topbar-spacer { width: 90px; flex-shrink: 0; }

    /* ── PAGE INTRO / SEARCH ── */
    .page-intro {
      position: relative; z-index: 2;
      padding: 1rem 1.1rem .9rem;
      animation: pageIn .8s .05s var(--ease-out) both;
    }
    @keyframes pageIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .search-wrap { position: relative; width: 100%; }
    .search-input {
      width: 100%; padding: .75rem 3rem .75rem 1.2rem;
      border-radius: 100px;
      border: 1.5px solid rgba(212,168,50,.35);
      background: rgba(20,14,4,.78);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      color: #fff; font-family: var(--ff-body); font-size: 1rem;
      outline: none; transition: border-color .25s ease, box-shadow .25s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,.4);
    }
    .search-input::placeholder { color: rgba(255,255,255,.38); }
    .search-input:focus {
      border-color: rgba(212,168,50,.7);
      box-shadow: 0 0 0 3px rgba(212,168,50,.12), 0 4px 20px rgba(0,0,0,.5);
    }
    .search-icon {
      position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
      color: var(--gold-400); font-size: 1.1rem; pointer-events: none;
    }
    .suggestions { display: none; }
    .no-results-card {
      grid-column: 1 / -1;
      text-align: center; padding: 2rem 1rem;
      font-family: var(--ff-cinzel); font-size: .95rem; letter-spacing: .1em;
      color: rgba(255,255,255,.4);
    }
    .item-card.hidden { display: none; }
    .section-label.hidden { display: none; }

    /* ── ITEMS GRID ── */
    /* ── ITEMS GRID ── */
    .items-section {
      position: relative; z-index: 2;
      padding: 0 .75rem 5rem;
      animation: pageIn .9s .12s var(--ease-out) both;
    }
    .section-label {
      font-family: var(--ff-cinzel); font-size: clamp(.7rem, 2.8vw, .85rem); letter-spacing: .2em;
      text-transform: uppercase; color: var(--gold-500);
      text-align: center; margin: 1.2rem 0 .9rem;
      opacity: .9;
    }
    .items-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: .75rem;
    }

    /* ── ITEM CARD (Square Image with Rounded Corners + Gold Line) ── */
    .item-card {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(14,10,3,.92);
      border: 1px solid rgba(212,168,50,.22);
      box-shadow: 0 6px 22px rgba(0,0,0,.65);
      backdrop-filter: blur(12px);
      display: flex; flex-direction: column;
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
      touch-action: manipulation;
    }
    .item-card:hover {
      transform: translateY(-3px);
      border-color: rgba(212,168,50,.55);
      box-shadow: 0 12px 32px rgba(0,0,0,.8), 0 0 24px rgba(212,168,50,.18);
    }
    .item-card.ordered {
      border-color: var(--gold-500);
      box-shadow: 0 0 0 1.5px var(--gold-500), 0 10px 28px rgba(212,168,50,.25);
    }

    /* Square Image Container */
    .item-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 17px 17px 0 0;
      background: rgba(0,0,0,.4);
    }
    .item-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform .4s ease;
      display: block;
    }
    .item-card:hover .item-img-wrap img { transform: scale(1.05); }

    /* Pure Veg indicator */
    .item-badge {
      position: absolute; top: .55rem; left: .55rem; z-index: 2;
      display: flex; align-items: center; justify-content: center;
      width: 15px; height: 15px;
      border: 2px solid #2ecc40; border-radius: 3px;
      background: rgba(4,20,6,.85);
    }
    .item-badge-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #2ecc40; box-shadow: 0 0 4px #2ecc40;
    }

    /* Gold Divider Line Below Image */
    .item-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-500), transparent);
      opacity: .5;
    }

    /* Card Details */
    .item-info {
      padding: .65rem .65rem .75rem;
      display: flex; flex-direction: column; gap: .4rem;
      flex: 1; justify-content: space-between;
    }
    .item-name {
      font-family: var(--ff-cinzel);
      font-size: clamp(0.76rem, 3.3vw, 0.96rem); font-weight: 700;
      letter-spacing: .03em; color: #fff;
      line-height: 1.25;
      text-shadow: 0 1px 6px rgba(0,0,0,.8);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.5em;
    }
    .item-price-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: .25rem;
      margin-top: auto;
    }
    .item-price {
      font-family: var(--ff-serif);
      font-size: clamp(0.92rem, 3.8vw, 1.15rem); font-weight: 700;
      color: var(--gold-300);
      letter-spacing: .02em;
    }

    /* Counter / Stepper: Default state (qty = 0) hides minus and 0, shows only + button */
    .order-counter {
      display: inline-flex; align-items: center; justify-content: center;
      transition: all .2s ease;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 100px;
      padding: 0;
    }
    .order-counter .counter-btn.minus,
    .order-counter .counter-display {
      display: none !important;
    }
    .order-counter .counter-btn.plus {
      width: 28px; height: 28px; border-radius: 50%;
      border: none; cursor: pointer;
      font-size: 1.15rem; font-weight: 700; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--gold-400), var(--gold-600));
      color: #080500;
      box-shadow: 0 0 10px rgba(212,168,50,.35);
      transition: transform .15s ease, background .15s ease;
      touch-action: manipulation;
    }
    .order-counter .counter-btn.plus:active { transform: scale(.88); }

    /* When qty > 0 (.has-items), expand into full pill stepper [ - ] [ QTY ] [ + ] */
    .order-counter.has-items {
      background: rgba(212,168,50,.18);
      border: 1px solid var(--gold-500);
      padding: .15rem .35rem;
      gap: .25rem;
    }
    .order-counter.has-items .counter-btn.minus {
      display: flex !important; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 50%;
      border: none; cursor: pointer;
      font-size: .95rem; font-weight: 700; line-height: 1;
      background: rgba(255,255,255,.14); color: #fff;
      transition: transform .15s ease;
      touch-action: manipulation;
    }
    .order-counter.has-items .counter-btn.minus:active { transform: scale(.88); }
    .order-counter.has-items .counter-display {
      display: inline-block !important;
      min-width: 16px; text-align: center;
      font-family: var(--ff-body); font-size: .84rem; font-weight: 700;
      color: var(--gold-200);
    }
    .order-counter.has-items .counter-btn.plus {
      width: 22px; height: 22px;
      font-size: .95rem;
    }

    /* ── CART BAR ── */
    .cart-bar {
      position: fixed; bottom: 4.8rem; left: 1rem; right: 1rem; z-index: 150;
      background: linear-gradient(135deg, rgba(28,20,5,.97), rgba(16,11,2,.98));
      border: 1.5px solid var(--gold-500);
      border-radius: 16px;
      padding: .75rem 1.2rem;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 8px 32px rgba(0,0,0,.8), 0 0 25px rgba(212,168,50,.3);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      transform: translateY(120%); opacity: 0;
      transition: transform .35s var(--ease-bounce), opacity .3s ease;
      pointer-events: none;
    }
    .cart-bar.visible {
      transform: translateY(0); opacity: 1; pointer-events: all;
    }
    .cart-info { display: flex; flex-direction: column; gap: .1rem; }
    .cart-count {
      font-size: .72rem; letter-spacing: .08em; text-transform: uppercase;
      color: var(--gold-400); font-family: var(--ff-body); font-weight: 600;
    }
    .cart-total {
      font-family: var(--ff-serif); font-size: 1.2rem; font-weight: 700;
      color: #fff;
    }
    .cart-btn {
      background: linear-gradient(135deg, var(--gold-400), var(--gold-600));
      color: #080500; font-family: var(--ff-body); font-size: .85rem; font-weight: 700;
      letter-spacing: .06em; padding: .65rem 1.3rem; border-radius: 100px;
      border: none; cursor: pointer; box-shadow: 0 0 18px rgba(212,168,50,.5);
      transition: transform .2s ease, box-shadow .2s ease;
      touch-action: manipulation;
    }
    .cart-btn:active { transform: scale(.95); }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 8rem; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(16,12,4,.96); border: 1px solid rgba(212,168,50,.4);
      border-radius: 100px; padding: .55rem 1.4rem;
      font-size: .75rem; letter-spacing: .06em; color: var(--gold-300);
      opacity: 0; transition: .35s ease; z-index: 9999; white-space: nowrap;
      backdrop-filter: blur(16px); box-shadow: 0 4px 24px rgba(0,0,0,.5);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── RESPONSIVE ── */
    @media (min-width: 500px) {
      .items-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
    }
    @media (min-width: 768px) {
      .items-grid { grid-template-columns: repeat(3, 1fr); gap: 1.2rem; }
      .items-section { padding: 0 2rem 4rem; }
      .cart-bar { left: 2rem; right: 2rem; }
    }
    @media (min-width: 1100px) {
      .items-grid { grid-template-columns: repeat(4, 1fr); gap: 1.3rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  
    /* ── POPUP OVERLAY (ORDER CONFIRMED) ── */
    .order-popup-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
      opacity: 0; pointer-events: none;
      transition: opacity .35s ease;
    }
    .order-popup-overlay.show { opacity: 1; pointer-events: all; }
    .order-popup-card {
      background: linear-gradient(145deg, rgba(26,18,4,.98), rgba(12,8,2,.98));
      border: 1.5px solid var(--gold-500);
      border-radius: 24px;
      padding: 2.2rem 1.8rem;
      text-align: center;
      max-width: 380px; width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,.9), 0 0 40px rgba(212,168,50,.35);
      transform: scale(.85) translateY(20px);
      transition: transform .4s var(--ease-bounce, cubic-bezier(.34,1.56,.64,1));
    }
    .order-popup-overlay.show .order-popup-card { transform: scale(1) translateY(0); }
    .popup-icon {
      font-size: 3rem; margin-bottom: .8rem;
      filter: drop-shadow(0 0 16px rgba(212,168,50,.6));
      animation: popIcon .6s var(--ease-bounce, cubic-bezier(.34,1.56,.64,1)) both;
    }
    @keyframes popIcon { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .popup-title {
      font-family: var(--ff-cinzel, 'Cinzel', serif); font-size: 1.3rem; font-weight: 700;
      color: var(--gold-300, #f5d48a); margin-bottom: .6rem; letter-spacing: .08em;
    }
    .popup-desc {
      font-size: .88rem; line-height: 1.55;
      color: rgba(255,255,255,.8); font-family: var(--ff-body, sans-serif);
      margin-bottom: 1.4rem;
    }
    .popup-close-btn {
      background: linear-gradient(135deg, var(--gold-400, #e8c56a), var(--gold-600, #b8901e));
      color: #080500; font-family: var(--ff-body, sans-serif); font-size: .85rem; font-weight: 700;
      padding: .65rem 2rem; border-radius: 100px; border: none; cursor: pointer;
      letter-spacing: .06em; box-shadow: 0 0 16px rgba(212,168,50,.4);
      transition: transform .2s ease;
    }
    .popup-close-btn:active { transform: scale(.94); }

    /* ── TASKBAR ── */
    .taskbar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
      background: rgba(10,7,2,.95);
      border-top: 1px solid rgba(212,168,50,.3);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      display: flex; align-items: center; justify-content: space-around;
      padding: .6rem 0 calc(.6rem + env(safe-area-inset-bottom, 0px));
      box-shadow: 0 -8px 32px rgba(0,0,0,.6);
    }
    .taskbar-btn {
      display: flex; flex-direction: column; align-items: center; gap: .2rem;
      text-decoration: none; color: rgba(255,255,255,.5);
      font-family: var(--ff-body, sans-serif); font-size: .65rem; letter-spacing: .05em;
      transition: color .25s ease, transform .2s ease;
      flex: 1; -webkit-tap-highlight-color: transparent;
    }
    .taskbar-icon { font-size: 1.2rem; margin-bottom: .1rem; }
    .taskbar-btn.active { color: var(--gold-400, #e8c56a); }
    .taskbar-btn.active .taskbar-icon { filter: drop-shadow(0 0 6px var(--gold-glow, rgba(212,168,50,.55))); }
    .taskbar-btn:hover { color: var(--gold-300, #f5d48a); transform: translateY(-2px); }

  </style>
</head>
<body>

  <!-- FIXED BACKGROUND -->
  <div class="bg">
    <img src="ALL Images/Hotel Tulsi Customer BG image_result.webp" alt="Hotel Tulsi ambience"
         onerror="this.style.display='none'"/>
    <div class="bg-grad"></div>
  </div>

  <!-- PARTICLES -->
  <div class="particles" id="particles"></div>

  <!-- TOPBAR -->
  <div class="topbar">
    <a href="menu.html" class="back-btn" id="backBtn" onclick="passParams(event)">
      <span class="back-arrow">&#8592;</span> Back
    </a>
    <div class="topbar-title" id="topbarTitle">Starters</div>
    <div class="topbar-spacer"></div>
  </div>

  <!-- PAGE INTRO / SEARCH -->
  <div class="page-intro">
    <div class="search-wrap">
      <input class="search-input" id="searchInput" type="text" autocomplete="off"
             placeholder="Search starters..." aria-label="Search menu items"/>
      <span class="search-icon">&#128269;</span>
      <div class="suggestions" id="suggestions"></div>
    </div>
  </div>

  <!-- ITEMS SECTION -->
  <section class="items-section" aria-label="Starter Items">
    <div class="items-grid" id="itemsGrid"></div>
  </section>

  <!-- CART BAR -->
  <div class="cart-bar" id="cartBar">
    <div class="cart-info">
      <div class="cart-count" id="cartCount">0 items</div>
      <div class="cart-total" id="cartTotal">₹0</div>
    </div>
    <button class="cart-btn" id="cartBtn" onclick="placeOrder()">Confirm Order</button>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

      <!-- ══ TASKBAR ══ -->
  <div class="taskbar">
    <a href="menu.html" class="taskbar-btn" id="taskbarHome" onclick="passParams(event)">
      <div class="taskbar-icon">🏠</div>
      <span id="txtHome">Home</span>
    </a>
    <a href="my_orders.html" class="taskbar-btn" id="taskbarOrders" onclick="passParamsToOrders(event)">
      <div class="taskbar-icon">📝</div>
      <span id="txtMyOrder">My Order</span>
    </a>
  </div>

  <!-- ══ ORDER POPUP OVERLAY ══ -->
  <div class="order-popup-overlay" id="orderPopupOverlay">
    <div class="order-popup-card">
      <div class="popup-icon">🍽️</div>
      <div class="popup-title">✨ Order Confirmed</div>
      <div class="popup-desc" id="popupDesc">
        Your order has been sent to the kitchen and will be served shortly. Thank you! 😊
      </div>
      <button class="popup-close-btn" onclick="document.getElementById('orderPopupOverlay').classList.remove('show')">Great!</button>
    </div>
  </div>

  <script src="menu-page.js"></script>
  <script src="geofence.js"></script>
  <script>
    'use strict';

    /* ── Session params ── */
    const params  = new URLSearchParams(location.search);
    const lang    = params.get('lang')    || sessionStorage.getItem('hotel_lang')    || 'en';
    const table   = params.get('table')   || sessionStorage.getItem('hotel_table')   || '—';
    const persons = params.get('persons') || sessionStorage.getItem('hotel_persons') || '1';

    /* ── Language strings ── */
    const UI = {
      en: { 
        pageTitle: 'Starters',
        search: 'Search starters...', 
        back: '← Back', 
        noResults: 'No items found', 
        papads: 'Papads', 
        tandoorstarters: 'Tandoor Starters', 
        chinesestarters: 'Chinese Starters', 
        starters: 'Starters', 
        confirmOrder: 'Confirm Order', 
        items: 'items', 
        item: 'item', 
        home: 'Home', 
        myOrder: 'My Orders' 
      },
      hi: { 
        pageTitle: 'स्टार्टर्स',
        search: 'स्टार्टर खोजें...', 
        back: '← वापस', 
        noResults: 'कोई आइटम नहीं मिला', 
        papads: 'पापड़', 
        tandoorstarters: 'तंदूर स्टार्टर्स', 
        chinesestarters: 'चाइनीज स्टार्टर्स', 
        starters: 'स्टार्टर्स', 
        confirmOrder: 'ऑर्डर कन्फर्म करें', 
        items: 'आइटम', 
        item: 'आइटम', 
        home: 'होम', 
        myOrder: 'मेरा ऑर्डर' 
      },
      mr: { 
        pageTitle: 'स्टार्टर्स',
        search: 'स्टार्टर शोधा...', 
        back: '← मागे', 
        noResults: 'कोणती वस्तू सापडली नाही', 
        papads: 'पापड', 
        tandoorstarters: 'तंदूर स्टार्टर्स', 
        chinesestarters: 'चायनीज स्टार्टर्स', 
        starters: 'स्टार्टर्स', 
        confirmOrder: 'ऑर्डर निश्चित करा', 
        items: 'वस्तू', 
        item: 'वस्तू', 
        home: 'मुख्यपृष्ठ', 
        myOrder: 'माझी ऑर्डर' 
      },
    };
    const ui = UI[lang] || UI.en;

    /* ── Apply UI language ── */
    if (document.getElementById('topbarTitle')) document.getElementById('topbarTitle').textContent = ui.pageTitle;
    document.getElementById('searchInput').placeholder = ui.search;
    document.getElementById('backBtn').childNodes[1].textContent = ' ' + ui.back.replace('← ','');
    document.querySelector('.back-arrow').textContent = '←';
    document.getElementById('cartBtn').textContent = ui.confirmOrder;
    document.getElementById('txtHome').textContent = ui.home;
    document.getElementById('txtMyOrder').textContent = ui.myOrder;
    /* ── Menu data (loaded from DB) ── */
    const PAGE_CATEGORY = 'starter';

    /* resolve display name per language */
    function getName(item) { return item[lang] || item.en; }
    const cart = {};

    /* ── Render via shared helper (fetches DB, builds grid + section labels + search) ── */
    const grid = document.getElementById('itemsGrid');
    initMenuPage({ category: PAGE_CATEGORY, fallbackImg: 'ALL Images/Starter_Paneer_Tikka.webp', ui, getName });

    /* ── Quantity change ── */
    function changeQty(id, delta) {
      const current = cart[id] || 0;
      const next = Math.max(0, current + delta);
      cart[id] = next;
      const counter = document.getElementById('counter-' + id);
      const qtyEl   = document.getElementById('qty-' + id);
      if (qtyEl) qtyEl.textContent = next;
      const card = document.getElementById('card-' + id);
      if (next > 0) {
        if (counter) counter.classList.add('has-items');
        if (card) card.classList.add('ordered');
      } else {
        if (counter) counter.classList.remove('has-items');
        if (card) card.classList.remove('ordered');
      }
      updateCart();
    }

    /* ── Update cart bar ── */
    function updateCart() {
      const activeItems = [];
      let totalItems = 0;
      let totalPrice = 0;
      MENU.forEach(item => {
        const q = cart[item.id] || 0;
        if (q > 0) {
          activeItems.push({ name: getName(item), qty: q, price: q * item.price });
          totalItems += q;
          totalPrice += q * item.price;
        }
      });
      const bar = document.getElementById('cartBar');
      const cartCountEl = document.getElementById('cartCount');
      const cartTotalEl = document.getElementById('cartTotal');
      if (activeItems.length === 1) {
        cartCountEl.textContent = activeItems[0].name + ' (' + activeItems[0].qty + ')';
        cartTotalEl.textContent = '₹' + activeItems[0].price;
      } else if (activeItems.length > 1) {
        cartCountEl.textContent = activeItems.map(it => it.name + ' (' + it.qty + ')').join(', ');
        cartTotalEl.textContent = 'Total: ₹' + totalPrice;
      } else {
        cartCountEl.textContent = '0 items';
        cartTotalEl.textContent = '₹0';
      }
      if (totalItems > 0) bar.classList.add('visible');
      else bar.classList.remove('visible');
    }

        /* ── Place order ── */
    async function placeOrder() {
      const items = MENU.filter(i => (cart[i.id] || 0) > 0);
      if (items.length === 0) return;

      // Security Check (Geofence / Wi-Fi / Table PIN)
      let secAuth = { security_token: '', client_lat: 0, client_lng: 0 };
      if (window.HotelSecurity) {
        try {
          secAuth = await HotelSecurity.verifyOrderLocation();
        } catch (secErr) {
          console.warn('Security verification cancelled:', secErr);
          return;
        }
      }

      const apiItems = items.map(item => ({
        id: item.id, name: item.en, category: PAGE_CATEGORY,
        price: item.price, qty: cart[item.id]
      }));

      const fetchPayload = { 
        table: table, 
        persons: parseInt(persons) || 1, 
        customer_notes: '', 
        items: apiItems,
        security_token: secAuth.security_token || '',
        client_lat: secAuth.client_lat || 0,
        client_lng: secAuth.client_lng || 0
      };

      try {
        const response = await fetch('api/create-order.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(fetchPayload)
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          if (result.security_challenge && window.HotelSecurity) {
            sessionStorage.removeItem('hotel_security_token');
            const retryAuth = await HotelSecurity.verifyOrderLocation();
            if (retryAuth) {
              fetchPayload.security_token = retryAuth.security_token || '';
              fetchPayload.client_lat = retryAuth.client_lat || 0;
              fetchPayload.client_lng = retryAuth.client_lng || 0;
              
              const retryRes = await fetch('api/create-order.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(fetchPayload)
              });
              const retryData = await retryRes.json();
              if (!retryRes.ok || !retryData.success) {
                alert('Order failed: ' + (retryData.error || 'Security check rejected.'));
                return;
              }
            } else {
              return;
            }
          } else {
            alert('Order failed: ' + (result.error || 'Server error'));
            return;
          }
        }

        // Order successfully placed on server
        let stored = [];
        const orderKey = 'hotel_confirmed_orders_' + table;
        try { stored = JSON.parse(sessionStorage.getItem(orderKey) || '[]'); } catch (e) { stored = []; }

        items.forEach(item => {
          const qty = cart[item.id];
          const existing = stored.find(s => s.id === item.id);
          if (existing) existing.qty += qty;
          else stored.push({ id: item.id, en: item.en, hi: item.hi, mr: item.mr, price: item.price, qty: qty });
        });
        sessionStorage.setItem(orderKey, JSON.stringify(stored));

        for (let id in cart) {
          if (cart.hasOwnProperty(id)) {
            cart[id] = 0;
            const counter = document.getElementById('counter-' + id);
            const qtyEl   = document.getElementById('qty-' + id);
            const card = document.getElementById('card-' + id);
            if (qtyEl) qtyEl.textContent = '0';
            if (counter) counter.classList.remove('has-items');
            if (card) card.classList.remove('ordered');
          }
        }
        updateCart();

        const popup = document.getElementById('orderPopupOverlay');
        const popupDesc = document.getElementById('popupDesc');
        const msgs = {
          en: 'Your order has been sent to the kitchen and will be served shortly. Thank you! 😊',
          hi: 'आपका ऑर्डर किचन में भेज दिया गया है और जल्द ही परोसा जाएगा। धन्यवाद! 😊',
          mr: 'तुमची ऑर्डर किचनमध्ये पाठवली गेली आहे आणि लवकरच दिली जाईल. धन्यवाद! 😊'
        };
        const titles = { en: '✨ Order Confirmed', hi: '✨ ऑर्डर कन्फर्म', mr: '✨ ऑर्डर निश्चित' };
        const titleEl = document.querySelector('.popup-title');
        if (titleEl) titleEl.textContent = titles[lang] || titles.en;
        if (popupDesc) popupDesc.textContent = msgs[lang] || msgs.en;
        if (popup) {
          popup.classList.add('show');
          setTimeout(() => popup.classList.remove('show'), 5000);
        }

      } catch (err) {
        console.error('Order placement error:', err);
        alert('Could not submit order. Please check your connection.');
      }
    }

        /* ── Back button params ── */
    function passParams(e) {
      const base = 'menu.html';
      const qObj = { lang, table, persons };
      const tok = (window.TableSecurity ? window.TableSecurity.getActiveToken(table) : '') || (new URLSearchParams(location.search)).get('token') || '';
      if (tok) qObj.token = tok;
      const q = new URLSearchParams(qObj).toString();
      e.currentTarget.href = base + '?' + q;
    }

    /* ── My Orders button params ── */
    function passParamsToOrders(e) {
      const base = 'my_orders.html';
      const qObj = { lang, table, persons };
      const tok = (window.TableSecurity ? window.TableSecurity.getActiveToken(table) : '') || (new URLSearchParams(location.search)).get('token') || '';
      if (tok) qObj.token = tok;
      const q = new URLSearchParams(qObj).toString();
      e.currentTarget.href = base + '?' + q;
    }

    /* ── Toast ── */
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2600);
    }

    /* ── Gold particles ── */
    (function() {
      const c = document.getElementById('particles');
      for (let i = 0; i < 18; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const s = 1.5 + Math.random() * 2.2;
        p.style.cssText = [
          '--dur:'   + (10 + Math.random() * 14) + 's',
          '--delay:' + (Math.random() * 16) + 's',
          'left:'    + (Math.random() * 100) + '%',
          'bottom:'  + (-5 + Math.random() * 14) + '%',
          'width:'   + s + 'px',
          'height:'  + s + 'px',
        ].join(';');
        c.appendChild(p);
      }
    })();
  </script>
