<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Golden Stone Hotel | Menu Categories</title>
  <meta name="description" content="Browse our curated pure vegetarian menu at Golden Stone Hotel — crafted with passion."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>

  <style>
    /* ─────────────────────── TOKENS ─────────────────────── */
    :root {
      --gold-100: #fff9ed;
      --gold-200: #fef3c7;
      --gold-300: #f5d48a;
      --gold-400: #e8c56a;
      --gold-500: #d4a832;
      --gold-600: #b8901e;
      --gold-700: #8b6914;
      --stone-950: #080500;
      --gold-glow: rgba(212,168,50,.55);
      --ff-serif:  'Playfair Display', Georgia, serif;
      --ff-cinzel: 'Cinzel', 'Times New Roman', serif;
      --ff-body:   'Inter', 'Helvetica Neue', sans-serif;
      --ease-out:    cubic-bezier(.22,1,.36,1);
      --ease-bounce: cubic-bezier(.34,1.56,.64,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }
    body {
      font-family: var(--ff-body);
      color: #fff;
      background: var(--stone-950);
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ─────────────────────── FIXED BG ─────────────────────── */
    .bg {
      position: fixed; inset: 0; z-index: 0; overflow: hidden;
      pointer-events: none;
    }
    .bg .bg-img {
      width: 100%; height: 100%;
      background-size: cover;
      background-position: center;
      filter: brightness(.45) saturate(.85);
      animation: bgZoom 35s ease-in-out infinite alternate;
    }
    @keyframes bgZoom { from { transform: scale(1); } to { transform: scale(1.07); } }
    .bg-grad {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 45% at 50% 0%, rgba(180,130,20,.22) 0%, transparent 70%),
        linear-gradient(to bottom,
          rgba(8,5,0,.3) 0%,
          rgba(6,4,0,.15) 30%,
          rgba(4,3,0,.7) 100%
        );
    }
    .bg-noise {
      position: absolute; inset: 0;
      background-image:
        repeating-linear-gradient(0deg,   rgba(255,255,255,.008) 0,rgba(255,255,255,.008) 1px,transparent 1px,transparent 52px),
        repeating-linear-gradient(90deg,  rgba(255,255,255,.006) 0,rgba(255,255,255,.006) 1px,transparent 1px,transparent 68px);
    }

    /* ─────────────────────── PARTICLES ─────────────────────── */
    .particles {
      position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden;
    }
    .particle {
      position: absolute; border-radius: 50%;
      background: var(--gold-300); opacity: 0;
      animation: floatUp var(--dur,10s) var(--delay,0s) ease-in infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) scale(1); opacity: 0; }
      8%   { opacity: .4; }
      85%  { opacity: .08; }
      100% { transform: translateY(-105vh) scale(.15); opacity: 0; }
    }

    /* ─────────────────────── STICKY TOPBAR ─────────────────────── */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      padding: .7rem 1.2rem .65rem;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(8,5,0,.75);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(212,168,50,.14);
    }

    .back-btn {
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16);
      color: rgba(255,255,255,.6); font-family: var(--ff-body); font-size: .76rem;
      letter-spacing: .06em; padding: .38rem .9rem; border-radius: 100px;
      cursor: pointer; backdrop-filter: blur(10px); transition: .25s ease;
      text-decoration: none; display: inline-flex; align-items: center; gap: .3rem;
    }
    .back-btn:hover { background: rgba(255,255,255,.15); color: #fff; }

    .topbar-brand {
      font-family: var(--ff-cinzel); font-size: .8rem; font-weight: 700;
      letter-spacing: .2em;
      background: linear-gradient(135deg, var(--gold-300), var(--gold-500), var(--gold-200));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    .topbar-right {
      font-family: var(--ff-cinzel); font-size: .7rem;
      color: rgba(255,255,255,.4); letter-spacing: .08em;
    }
    .topbar-right span { color: var(--gold-400); font-weight: 600; }

    /* ─────────────────────── PAGE HEADER ─────────────────────── */
    .page-header {
      position: relative; z-index: 2;
      text-align: center;
      padding: 2.2rem 1.2rem 1.4rem;
      animation: pageIn .85s .05s var(--ease-out) both;
    }
    @keyframes pageIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

    /* crest ornament */
    .crest {
      display: flex; align-items: center; justify-content: center;
      gap: .55rem; margin-bottom: .4rem;
    }
    .crest-line {
      width: 40px; height: 1px;
      background: linear-gradient(to right, transparent, var(--gold-400));
    }
    .crest-line:last-child { background: linear-gradient(to left, transparent, var(--gold-400)); }
    .crest-star {
      font-size: .8rem; color: var(--gold-400);
      filter: drop-shadow(0 0 6px var(--gold-glow));
      animation: spin 18s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* BIG page title */
    .page-title {
      font-family: var(--ff-cinzel);
      font-size: clamp(1.6rem, 6vw, 2.6rem);
      font-weight: 700; letter-spacing: .14em;
      color: #fff;
      text-shadow:
        0 2px 30px rgba(0,0,0,.8),
        0 0 50px rgba(212,168,50,.3);
      margin-bottom: .4rem;
    }

    .title-rule {
      width: 80px; height: 2px; margin: 0 auto .65rem;
      background: linear-gradient(to right, transparent, var(--gold-500), transparent);
      border-radius: 2px;
    }

    /* Pure Veg badge */
    .veg-badge {
      display: inline-flex; align-items: center; gap: .55rem;
      background: rgba(15,60,20,.5);
      border: 1.5px solid rgba(46,204,64,.45);
      border-radius: 10px; padding: .32rem .85rem .32rem .65rem;
      backdrop-filter: blur(10px);
      font-family: var(--ff-body); font-size: .78rem;
      font-weight: 600; letter-spacing: .08em;
      color: #74ef80;
      box-shadow: 0 0 18px rgba(46,204,64,.15);
    }
    /* FSSAI-style: green square + green circle */
    .veg-symbol {
      display: flex; align-items: center; justify-content: center;
      width: 18px; height: 18px;
      border: 2.5px solid #2ecc40; border-radius: 4px;
      flex-shrink: 0;
    }
    .veg-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #2ecc40;
      box-shadow: 0 0 6px rgba(46,204,64,.9);
    }

    /* ─────────────────────── SCROLL HINT ─────────────────────── */
    .scroll-hint {
      text-align: center; margin-bottom: 1rem;
      font-size: .68rem; letter-spacing: .1em; text-transform: uppercase;
      color: rgba(255,255,255,.28);
      animation: bounce 2.4s ease-in-out infinite;
    }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

    /* ─────────────────────── CATEGORIES GRID ─────────────────────── */
    .categories-section {
      position: relative; z-index: 2;
      padding: 0 1.1rem 2.5rem;
      animation: pageIn .9s .18s var(--ease-out) both;
    }

    /* 2-col masonry-like grid — tall cards, full photo */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    /* ─────────────────────── CATEGORY CARD ─────────────────────── */
    .cat-card {
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      cursor: pointer;
      height: 220px;          /* tall portrait card */
      border: 1px solid rgba(212,168,50,.2);
      box-shadow:
        0 8px 32px rgba(0,0,0,.6),
        inset 0 1px 0 rgba(255,255,255,.08);
      transition:
        transform .35s var(--ease-bounce),
        box-shadow .35s ease,
        border-color .3s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* Gold top shimmer line */
    .cat-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px; z-index: 3;
      background: linear-gradient(90deg, transparent, rgba(212,168,50,.7), transparent);
      opacity: .7;
    }

    .cat-card:hover {
      transform: translateY(-6px) scale(1.025);
      border-color: rgba(212,168,50,.6);
      box-shadow:
        0 0 50px rgba(212,168,50,.25),
        0 20px 50px rgba(0,0,0,.7),
        inset 0 1px 0 rgba(255,255,255,.14);
    }
    .cat-card:active { transform: scale(.97); }

    /* Full-bleed photo served as background image */
    .cat-bg-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      background-size: cover;
      background-position: center;
      transition: transform .55s var(--ease-out);
    }
    .cat-card:hover .cat-bg-img { transform: scale(1.1); }

    /* Dark scrim so text is legible over any photo */
    .cat-scrim {
      position: absolute; inset: 0; z-index: 1;
      background: linear-gradient(
        to top,
        rgba(4,2,0,.92) 0%,
        rgba(4,2,0,.55) 45%,
        rgba(0,0,0,.1) 100%
      );
      transition: opacity .35s ease;
    }
    .cat-card:hover .cat-scrim {
      background: linear-gradient(
        to top,
        rgba(4,2,0,.95) 0%,
        rgba(4,2,0,.5) 50%,
        rgba(0,0,0,.05) 100%
      );
    }

    /* Content sits above scrim */
    .cat-content {
      position: absolute; inset: 0; z-index: 2;
      display: flex; flex-direction: column;
      justify-content: flex-end;
      padding: 1.1rem 1.1rem 1rem;
    }

    /* BIG category name */
    .cat-name {
      font-family: var(--ff-cinzel);
      font-size: clamp(1rem, 4.5vw, 1.35rem);
      font-weight: 700;
      letter-spacing: .06em;
      line-height: 1.2;
      color: #fff;
      text-shadow:
        0 2px 12px rgba(0,0,0,.9),
        0 0 30px rgba(212,168,50,.2);
      margin-bottom: .35rem;
    }

    /* Explore CTA line */
    .cat-cta {
      display: flex; align-items: center; gap: .5rem;
      font-family: var(--ff-body); font-size: .68rem;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--gold-400);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .3s ease, transform .3s var(--ease-out);
    }
    .cat-cta-line {
      display: block; height: 1px; width: 0;
      background: var(--gold-500);
      transition: width .35s var(--ease-out);
    }
    .cat-card:hover .cat-cta { opacity: 1; transform: translateY(0); }
    .cat-card:hover .cat-cta-line { width: 24px; }

    /* ─────────────────────── FOOTER ─────────────────────── */
    .info-footer {
      position: relative; z-index: 2;
      display: flex; align-items: center; justify-content: space-between;
      padding: .9rem 1.4rem 1.5rem;
      border-top: 1px solid rgba(212,168,50,.1);
      background: rgba(8,5,0,.6);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    .footer-table {
      display: flex; align-items: center; gap: .45rem;
      font-family: var(--ff-cinzel); font-size: .7rem;
      color: rgba(255,255,255,.45); letter-spacing: .08em;
    }
    .footer-table span { color: var(--gold-400); font-weight: 600; }
    .footer-guests {
      font-size: .7rem; color: rgba(255,255,255,.35);
      letter-spacing: .05em;
    }

    /* ─────────────────────── TOAST ─────────────────────── */
    .toast {
      position: fixed; bottom: 5rem; left: 50%; /* Adjusted for taskbar */
      transform: translateX(-50%) translateY(20px);
      background: rgba(16,12,4,.96); border: 1px solid rgba(212,168,50,.4);
      border-radius: 100px; padding: .55rem 1.4rem;
      font-size: .75rem; letter-spacing: .06em; color: var(--gold-300);
      opacity: 0; transition: .35s ease; z-index: 9999; white-space: nowrap;
      backdrop-filter: blur(16px); box-shadow: 0 4px 24px rgba(0,0,0,.5);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ─────────────────────── TASKBAR ─────────────────────── */
    .taskbar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
      background: rgba(10,7,2,.95);
      border-top: 1px solid rgba(212,168,50,.3);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      display: flex; align-items: center; justify-content: space-around;
      padding: .6rem 0 calc(.6rem + env(safe-area-inset-bottom, 0px));
      box-shadow: 0 -8px 32px rgba(0,0,0,.6);
    }
    .taskbar-btn {
      display: flex; flex-direction: column; align-items: center; gap: .2rem;
      text-decoration: none; color: rgba(255,255,255,.5);
      font-family: var(--ff-body); font-size: .65rem; letter-spacing: .05em;
      transition: color .25s ease, transform .2s ease;
      flex: 1; -webkit-tap-highlight-color: transparent;
    }
    .taskbar-icon { font-size: 1.2rem; margin-bottom: .1rem; }
    .taskbar-btn.active { color: var(--gold-400); }
    .taskbar-btn.active .taskbar-icon { filter: drop-shadow(0 0 6px var(--gold-glow)); }
    .taskbar-btn:hover { color: var(--gold-300); transform: translateY(-2px); }

    /* Add padding to footer so it's not hidden behind taskbar */
    .info-footer { padding-bottom: 5rem; }

    /* ─────────────────────── RESPONSIVE ─────────────────────── */
    @media (min-width: 540px) {
      .cat-card { height: 260px; }
      .cat-name  { font-size: clamp(1.1rem, 3.5vw, 1.5rem); }
    }
    @media (min-width: 768px) {
      .grid { grid-template-columns: repeat(4, 1fr); gap: 1.1rem; }
      .cat-card { height: 280px; }
      .categories-section { padding: 0 1.5rem 3rem; }
    }
    @media (min-width: 1024px) {
      .cat-card { height: 320px; }
      .grid { gap: 1.3rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

  <script>
    'use strict';

    /* ── Session / URL data ── */
    const params  = new URLSearchParams(location.search);
    const lang    = params.get('lang')    || sessionStorage.getItem('hotel_lang')    || 'en';
    const table   = params.get('table')   || sessionStorage.getItem('hotel_table')   || '—';
    const persons = params.get('persons') || sessionStorage.getItem('hotel_persons') || '1';

    /* ── Multilingual strings ── */
    const STRINGS = {
      en: {
        pageTitle:    'Menu Categories',
        pureVeg:      'Pure Veg',
        scrollHint:   '↓ scroll to explore ↓',
        explore:      'Explore',
        backBtn:      '← Back',
        tableLabel:   'Table',
        guestSingular:'guest',
        guestPlural:  'guests',
        topGuests:    (n) => n + (n === '1' ? ' guest' : ' guests'),
        cats: {
          starters:  'Appetizers / Starters',
          main:      'Main Course',
          breads:    'Breads',
          rice:      'Rice & Biryani',
          sides:     'Side Dishes',
          desserts:  'Desserts',
          beverages: 'Beverages',
          water:     'Water Bottle',
        },
        home: 'Home',
        myOrder: 'My Orders',
      },
      hi: {
        pageTitle:    'मेनू श्रेणियाँ',
        pureVeg:      'शुद्ध शाकाहारी',
        scrollHint:   '↓ नीचे स्क्रॉल करें ↓',
        explore:      'देखें',
        backBtn:      '← वापस',
        tableLabel:   'टेबल',
        guestSingular:'अतिथि',
        guestPlural:  'अतिथि',
        topGuests:    (n) => n + ' अतिथि',
        cats: {
          starters:  'स्टार्टर्स',
          main:      'मुख्य व्यंजन',
          breads:    'रोटी / ब्रेड',
          rice:      'चावल और बिरयानी',
          sides:     'साइड डिश',
          desserts:  'मिठाई',
          beverages: 'पेय पदार्थ',
          water:     'पानी की बोतल',
        },
        home: 'होम',
        myOrder: 'मेरा ऑर्डर',
      },
      mr: {
        pageTitle:    'मेनू श्रेणी',
        pureVeg:      'शुद्ध शाकाहारी',
        scrollHint:   '↓ खाली स्क्रोल करा ↓',
        explore:      'पाहा',
        backBtn:      '← मागे',
        tableLabel:   'टेबल',
        guestSingular:'पाहुणे',
        guestPlural:  'पाहुणे',
        topGuests:    (n) => n + ' पाहुणे',
        cats: {
          starters:  'स्टार्टर्स',
          main:      'मुख्य जेवण',
          breads:    'पोळी / ब्रेड',
          rice:      'भात आणि बिर्याणी',
          sides:     'साइड डिश',
          desserts:  'गोड पदार्थ',
          beverages: 'पेये',
          water:     'पाण्याची बाटली',
        },
        home: 'मुख्यपृष्ठ',
        myOrder: 'माझी ऑर्डर',
      },
    };

    const str = STRINGS[lang] || STRINGS.en;

    /* ── Apply translations to DOM ── */
    // Page title (h1)
    document.querySelector('.page-title').textContent = str.pageTitle;

    // Pure Veg label
    document.getElementById('vegText').textContent = str.pureVeg;

    // Scroll hint
    document.querySelector('.scroll-hint').textContent = str.scrollHint;

    // Back button
    document.getElementById('backBtn').textContent = str.backBtn;
    document.getElementById('backBtn').href =
      'table-select.html?lang=' + encodeURIComponent(lang);

    // Topbar brand stays in English (hotel name), topbar right shows table/guests in lang
    document.getElementById('topGuests').textContent = str.topGuests(persons);
    document.getElementById('topTable').textContent  = table;

    // Footer
    document.getElementById('footerTable').textContent  = table;
    document.getElementById('footerGuests').textContent = str.topGuests(persons);
    // table label
    const footerTableBadge = document.querySelector('.footer-table');
    footerTableBadge.innerHTML = '🪑&nbsp; ' + str.tableLabel + ' <span id="footerTable">' + table + '</span>';
    
    // Taskbar strings
    document.getElementById('txtHome').textContent = str.home;
    document.getElementById('txtMyOrder').textContent = str.myOrder;

    // Category names
    const catMap = {
      'cat-starters':  str.cats.starters,
      'cat-main':      str.cats.main,
      'cat-breads':    str.cats.breads,
      'cat-rice':      str.cats.rice,
      'cat-sides':     str.cats.sides,
      'cat-desserts':  str.cats.desserts,
      'cat-beverages': str.cats.beverages,
      'cat-water':     str.cats.water,
    };
    Object.entries(catMap).forEach(([id, name]) => {
      const card = document.getElementById(id);
      if (card) card.querySelector('.cat-name').textContent = name;
    });

    // "Explore" labels on all cards
    document.querySelectorAll('.cat-cta').forEach(el => {
      // replace text node (keep the cta-line span)
      el.childNodes.forEach(n => { if (n.nodeType === 3) n.textContent = ' ' + str.explore; });
    });


    /* ── Category click ── */
    function openCategory(cat, label) {
      const q = new URLSearchParams({ lang, table, persons }).toString();
      if (cat === 'starters') {
        window.location.href = 'starters.html?' + q;
      } else if (cat === 'desserts') {
        window.location.href = 'dessert.html?' + q;
      } else if (cat === 'breads') {
        window.location.href = 'breads.html?' + q;
      } else if (cat === 'rice') {
        window.location.href = 'rice.html?' + q;
      } else if (cat === 'main') {
        window.location.href = 'main.html?' + q;
      } else if (cat === 'sides') {
        window.location.href = 'sides.html?' + q;
      } else if (cat === 'beverages') {
        window.location.href = 'beverages.html?' + q;
      } else if (cat === 'water') {
        window.location.href = 'water.html?' + q;
      } else {
        showToast('Opening ' + label + ' …');
        /* TODO: window.location.href = cat + '.html?' + q; */
      }
    }
    
    function passParamsToOrders(e) {
      const base = 'my_orders.html';
      const q = new URLSearchParams({ lang, table, persons }).toString();
      e.currentTarget.href = base + '?' + q;
    }

    /* Keyboard nav */
    document.querySelectorAll('.cat-card').forEach(card => {
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.click(); }
      });
    });

    /* ── Toast ── */
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2400);
    }

    /* ── Gold particles ── */
    (function() {
      const c = document.getElementById('particles');
      for (let i = 0; i < 22; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const s = 1.5 + Math.random() * 2.5;
        p.style.cssText = [
          '--dur:'   + (10 + Math.random() * 14) + 's',
          '--delay:' + (Math.random() * 16) + 's',
          'left:'    + (Math.random() * 100) + '%',
          'bottom:'  + (-5 + Math.random() * 18) + '%',
          'width:'   + s + 'px',
          'height:'  + s + 'px',
        ].join(';');
        c.appendChild(p);
      }
    })();

    /* ── Intersection-observer entrance animation ── */
    const io = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (en.isIntersecting) {
          en.target.style.opacity   = '1';
          en.target.style.transform = 'translateY(0) scale(1)';
          io.unobserve(en.target);
        }
      });
    }, { threshold: 0.08 });

    document.querySelectorAll('.cat-card').forEach((card, i) => {
      card.style.opacity    = '0';
      card.style.transform  = 'translateY(28px) scale(.97)';
      card.style.transition = `opacity .5s ${.1 + i * .06}s ease, transform .5s ${.1 + i * .06}s ease`;
      io.observe(card);
    });
  </script>

</body>
</html>
