<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Menu Control — Hotel Tulsi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--gold:#FFD700;--gold-border:rgba(255,215,0,.3);--white:#fff;--green:#22c55e;--red:#ef4444;--glass-bg:rgba(255,255,255,.05);--radius:12px;--navbar-h:60px;--botnav-h:65px}
    body{font-family:'Poppins',sans-serif;background:#0d0d0d;color:var(--white);min-height:100vh;overflow-x:hidden;padding-top:var(--navbar-h);padding-bottom:90px}
    .bg-layer{position:fixed;inset:0;background-image:url('ALL Images/Final BG Tulsi.webp');background-size:cover;background-position:center;z-index:-2}
    .bg-overlay{position:fixed;inset:0;background:rgba(0,0,0,.87);z-index:-1}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    /* NAVBAR */
    #navbar{position:fixed;top:0;left:0;right:0;height:var(--navbar-h);background:rgba(0,0,0,.95);border-bottom:1px solid var(--gold-border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:1000;backdrop-filter:blur(10px)}
    .navbar-brand{display:flex;align-items:center;gap:9px;font-size:1.1rem;font-weight:700;color:var(--gold)}
    .navbar-brand .brand-short{display:none}
    .navbar-right{display:flex;align-items:center;gap:14px}
    .owner-badge{display:flex;align-items:center;gap:6px;font-size:.83rem;color:rgba(255,255,255,.75)}
    .owner-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#b8860b);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:#000}
    .logout-btn{background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.35);color:var(--gold);padding:6px 14px;border-radius:8px;font-family:'Poppins',sans-serif;font-size:.78rem;font-weight:600;cursor:pointer;transition:background .2s}
    .logout-btn:hover{background:rgba(255,215,0,.18)}
    /* MAIN */
    .main-content{max-width:1100px;margin:0 auto;padding:24px 16px 32px}
    .page-title-wrap{text-align:center;margin-bottom:24px;animation:fadeInUp .5s ease .1s both}
    .page-title{font-size:1.8rem;font-weight:800;color:var(--white);letter-spacing:1px}
    .page-subtitle{margin-top:6px;font-size:.85rem;color:var(--gold)}
    /* TOOLBAR */
    .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;animation:fadeInUp .5s ease .15s both}
    .toolbar select,.toolbar input[type=text]{background:rgba(255,255,255,.08);border:1px solid rgba(255,215,0,.3);border-radius:8px;color:var(--white);padding:9px 14px;font-family:'Poppins',sans-serif;font-size:.85rem;outline:none}
    .toolbar select option{background:#1a1a1a}
    .toolbar select:focus,.toolbar input[type=text]:focus{border-color:rgba(255,215,0,.7)}
    .toolbar input[type=text]{flex:1;min-width:160px}
    .toolbar input[type=text]::placeholder{color:rgba(255,255,255,.35)}
    .btn{padding:9px 18px;border-radius:8px;font-family:'Poppins',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;border:none;transition:all .2s}
    .btn-gold{background:var(--gold);color:#000}
    .btn-gold:hover{background:#ffe033}
    .btn-ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.8)}
    .btn-ghost:hover{background:rgba(255,255,255,.15)}
    .btn-green{background:var(--green);color:#fff}
    .btn-green:hover{background:#16a34a}
    .btn-red{background:var(--red);color:#fff}
    .btn-red:hover{background:#dc2626}
    .btn-sm{padding:6px 12px;font-size:.75rem}
    /* TABLE */
    .table-wrap{background:var(--glass-bg);border:1px solid rgba(255,215,0,.15);border-radius:var(--radius);overflow:auto;animation:fadeInUp .5s ease .2s both}
    table{width:100%;border-collapse:collapse;min-width:700px}
    thead th{font-size:.72rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.4);padding:14px 16px;text-align:left;border-bottom:1px solid rgba(255,255,255,.07);white-space:nowrap}
    tbody tr{border-bottom:1px solid rgba(255,255,255,.04);transition:background .15s}
    tbody tr:hover{background:rgba(255,215,0,.04)}
    tbody td{padding:12px 16px;font-size:.85rem;vertical-align:middle}
    .item-name{font-weight:600;color:var(--white)}
    .item-cat{font-size:.72rem;color:rgba(255,255,255,.4);margin-top:2px}
    .badge-veg{display:inline-block;width:12px;height:12px;border-radius:2px;border:1.5px solid var(--green);position:relative;flex-shrink:0}
    .badge-veg::after{content:'';position:absolute;top:2px;left:2px;width:6px;height:6px;border-radius:50%;background:var(--green)}
    .badge-nonveg{display:inline-block;width:12px;height:12px;border-radius:2px;border:1.5px solid var(--red);position:relative;flex-shrink:0}
    .badge-nonveg::after{content:'';position:absolute;top:2px;left:2px;width:6px;height:6px;border-radius:50%;background:var(--red)}
    .toggle-btn{width:42px;height:24px;border-radius:12px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
    .toggle-btn.on{background:var(--green)}
    .toggle-btn.off{background:rgba(255,255,255,.2)}
    .toggle-btn::after{content:'';position:absolute;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
    .toggle-btn.on::after{left:21px}
    .toggle-btn.off::after{left:3px}
    .action-cell{display:flex;gap:8px;align-items:center}
    .loading-row{text-align:center;padding:32px;color:rgba(255,255,255,.4);font-size:.9rem}
    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:2000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
    .modal-overlay.open{opacity:1;pointer-events:all}
    .modal{background:#111;border:1px solid rgba(255,215,0,.4);border-radius:16px;padding:28px;width:90%;max-width:520px;max-height:90vh;overflow-y:auto;transform:scale(.92);transition:transform .25s}
    .modal-overlay.open .modal{transform:scale(1)}
    .modal h3{font-size:1.1rem;font-weight:700;color:var(--gold);margin-bottom:20px}
    .form-group{margin-bottom:14px}
    .form-group label{display:block;font-size:.75rem;font-weight:600;color:rgba(255,255,255,.5);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
    .form-group input,.form-group select{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,215,0,.25);border-radius:8px;color:var(--white);padding:10px 14px;font-family:'Poppins',sans-serif;font-size:.88rem;outline:none;transition:border-color .2s}
    .form-group input:focus,.form-group select:focus{border-color:rgba(255,215,0,.6)}
    .form-group select option{background:#1a1a1a}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
    /* TOAST */
    #toast{position:fixed;bottom:80px;right:16px;background:#16a34a;color:#fff;padding:10px 18px;border-radius:10px;font-size:.83rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s;z-index:3000}
    #toast.show{opacity:1}
    #toast.error{background:var(--red)}
    /* BOTTOM NAV */
    #bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--botnav-h);background:rgba(0,0,0,.95);border-top:1px solid rgba(255,215,0,.2);display:flex;align-items:stretch;z-index:1000;backdrop-filter:blur(10px)}
    .nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:rgba(255,255,255,.45);font-size:.6rem;font-weight:500;letter-spacing:.3px;text-transform:uppercase;position:relative;padding-bottom:4px;transition:color .2s}
    .nav-tab .nav-icon{font-size:1.2rem;line-height:1}
    .nav-tab:hover{color:rgba(255,255,255,.75)}
    .nav-tab.active{color:var(--gold)}
    .nav-tab.active::after{content:'';position:absolute;bottom:6px;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold)}
    @media(max-width:600px){.form-row{grid-template-columns:1fr}.page-title{font-size:1.4rem}.navbar-brand .brand-text{display:none}.navbar-brand .brand-short{display:inline}}
    
    /* UPLOAD ZONE */
    .upload-zone {
      border: 2px dashed rgba(255, 215, 0, 0.3);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      position: relative;
      background: rgba(255, 255, 255, 0.03);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 120px;
    }
    .upload-zone:hover {
      border-color: var(--gold);
      background: rgba(255, 215, 0, 0.05);
    }
    .upload-icon {
      font-size: 1.8rem;
      margin-bottom: 4px;
    }
    .upload-text {
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.6);
    }
    .upload-preview-wrap {
      position: absolute;
      inset: 0;
      background: #111;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .upload-preview-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .remove-img-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.9);
      color: white;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 10;
    }
    .remove-img-btn:hover {
      background: #dc2626;
    }
    .upload-loader {
      position: absolute;
      inset: 0;
      background: rgba(17, 17, 17, 0.85);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 215, 0, 0.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<div class="bg-layer" aria-hidden="true"></div>
<div class="bg-overlay" aria-hidden="true"></div>

<nav id="navbar">
  <div class="navbar-brand">
    <span>🏨</span>
    <span class="brand-text">Hotel Tulsi</span>
    <span class="brand-short">Golden Stone</span>
  </div>
  <div class="navbar-right">
    <div class="owner-badge"><div class="owner-avatar">O</div><span>Owner</span></div>
    <button class="logout-btn" onclick="window.location.href='owner-login.html'">Logout</button>
  </div>
</nav>

<main class="main-content">
  <div class="page-title-wrap">
    <h1 class="page-title">🍽️ MENU CONTROL</h1>
    <p class="page-subtitle">Add, edit, remove items and toggle availability</p>
  </div>

  <div class="toolbar">
    <select id="catFilter" onchange="loadMenu()">
      <option value="">All Categories</option>
      <option value="starter">Starter</option>
      <option value="main_course">Main Course</option>
      <option value="bread">Bread</option>
      <option value="rice_biryani">Rice &amp; Biryani</option>
      <option value="beverage">Beverage</option>
      <option value="dessert">Dessert</option>
      <option value="salad">Salad</option>
      <option value="side_dish">Side Dish</option>
      <option value="water">Water</option>
    </select>
    <input type="text" id="searchInput" placeholder="🔍 Search items…" oninput="filterTable()"/>
    <button class="btn btn-gold" onclick="openAdd()">+ Add Item</button>
    <a href="qr-generator.html" class="btn btn-ghost" style="text-decoration:none;">📱 QR Studio</a>
    <button class="btn btn-ghost" onclick="loadMenu()">↻ Refresh</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Item</th>
          <th>Category</th>
          <th>Section</th>
          <th>Price</th>
          <th>Type</th>
          <th>Available</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="menuBody">
        <tr><td colspan="7" class="loading-row">Loading menu…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<!-- ADD / EDIT MODAL -->
<div class="modal-overlay" id="itemModal">
  <div class="modal">
    <h3 id="modalTitle">Add Menu Item</h3>
    <div class="form-group">
      <label>Name (English) *</label>
      <input type="text" id="fNameEn" placeholder="e.g. Paneer Tikka"/>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Name (Hindi)</label>
        <input type="text" id="fNameHi" placeholder="पनीर टिक्का"/>
      </div>
      <div class="form-group">
        <label>Name (Marathi)</label>
        <input type="text" id="fNameMr" placeholder="पनीर टिक्का"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Category *</label>
        <select id="fCategory">
          <option value="starter">Starter</option>
          <option value="main_course">Main Course</option>
          <option value="bread">Bread</option>
          <option value="rice_biryani">Rice &amp; Biryani</option>
          <option value="beverage">Beverage</option>
          <option value="dessert">Dessert</option>
          <option value="salad">Salad</option>
          <option value="side_dish">Side Dish</option>
          <option value="water">Water</option>
        </select>
      </div>
      <div class="form-group">
        <label>Price (₹) *</label>
        <input type="number" id="fPrice" min="0" step="0.5" placeholder="150"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Section (sub-heading)</label>
        <input type="text" id="fSection" placeholder="e.g. Tandoori Specials"/>
      </div>
      <div class="form-group">
        <label>Type</label>
        <select id="fIsVeg">
          <option value="1">Veg</option>
          <option value="0">Non-Veg</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Prep Time (min)</label>
        <input type="number" id="fPrepTime" min="1" value="10"/>
      </div>
      <div class="form-group">
        <label>Sort Order</label>
        <input type="number" id="fSortOrder" value="0" min="0"/>
      </div>
    </div>
    
    <div class="form-group" style="margin-top: 14px;">
      <label>Item Image</label>
      <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fImageFile').click()">
        <span class="upload-icon">📷</span>
        <span class="upload-text">Click to upload image</span>
        <input type="file" id="fImageFile" accept="image/*" style="display:none" onchange="uploadImage(this)"/>
        <div class="upload-preview-wrap" id="uploadPreviewWrap" style="display:none;">
          <img id="uploadPreview" src="" alt="Preview" />
          <button type="button" class="remove-img-btn" onclick="removeUploadedImg(event)">&times;</button>
        </div>
        <div class="upload-loader" id="uploadLoader" style="display:none;">
          <div class="spinner"></div>
          <span style="font-size: 0.75rem; margin-top: 8px;">Uploading...</span>
        </div>
      </div>
      <input type="hidden" id="fImagePath" value=""/>
    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-gold" onclick="saveItem()">Save</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<nav id="bottom-nav">
  <a href="dashboard.html" class="nav-tab"><span class="nav-icon">🏠</span>Home</a>
  <a href="billing.html" class="nav-tab"><span class="nav-icon">🧾</span>Billing</a>
  <a href="menu-control.html" class="nav-tab active" aria-current="page"><span class="nav-icon">🍽️</span>Menu</a>
  <a href="reports.html" class="nav-tab"><span class="nav-icon">📊</span>Reports</a>
  <a href="order-history.html" class="nav-tab"><span class="nav-icon">📋</span>History</a>
</nav>

<script>
  var allItems = [], editId = null;
  var API = 'api/owner_menu.php';

  function fmt(n){ return '₹' + parseFloat(n).toLocaleString('en-IN'); }

  function showToast(msg, type) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show' + (type === 'error' ? ' error' : '');
    setTimeout(function(){ t.className = ''; }, 2500);
  }

  function catLabel(c) {
    return { starter:'Starter', main_course:'Main Course', bread:'Bread', rice_biryani:'Rice & Biryani',
             beverage:'Beverage', dessert:'Dessert', salad:'Salad', side_dish:'Side Dish', water:'Water' }[c] || c;
  }

  async function loadMenu() {
    var cat = document.getElementById('catFilter').value;
    var url = API + (cat ? '?category=' + encodeURIComponent(cat) : '');
    document.getElementById('menuBody').innerHTML = '<tr><td colspan="7" class="loading-row">Loading…</td></tr>';
    try {
      var res = await fetch(url);
      var d   = await res.json();
      if (!d.success) throw new Error(d.error);
      allItems = d.items;
      renderTable(allItems);
    } catch(e) {
      document.getElementById('menuBody').innerHTML = '<tr><td colspan="7" class="loading-row">Failed to load: ' + e.message + '</td></tr>';
    }
  }

  function getFallbackImg(cat) {
    return {
      starter: 'ALL Images/Starter_Paneer_Tikka.webp',
      main_course: 'ALL Images/MainCourse_panner_butter_Masala.webp',
      bread: 'ALL Images/Breads_Roti.webp',
      rice_biryani: 'ALL Images/Rice_and_Biryani.webp',
      beverage: 'ALL Images/Beverages_Mango_lassi.webp',
      dessert: 'ALL Images/Dessert_Rasmalai.webp',
      side_dish: 'ALL Images/Side_dishes_Raita.webp',
      water: 'ALL Images/Water_bottle.webp',
      salad: 'ALL Images/Side_dishes_Raita.webp'
    }[cat] || '';
  }

  function renderTable(items) {
    var tbody = document.getElementById('menuBody');
    if (!items.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="loading-row">No items found.</td></tr>';
      return;
    }
    tbody.innerHTML = items.map(function(item) {
      var vegBadge = item.is_veg == 1
        ? '<span class="badge-veg" title="Veg"></span>'
        : '<span class="badge-nonveg" title="Non-Veg"></span>';
      var toggleCls = item.is_available == 1 ? 'on' : 'off';
      var imgUrl = item.image_path || getFallbackImg(item.category);
      var imgTag = imgUrl 
        ? '<img src="' + imgUrl + '" style="width:36px;height:36px;border-radius:6px;object-fit:cover;background:rgba(255,255,255,0.05);border:1px solid rgba(255,215,0,0.15);flex-shrink:0;" />'
        : '<div style="width:36px;height:36px;border-radius:6px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,215,0,0.15);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;">🍽️</div>';
      
      return '<tr id="row-' + item.id + '">' +
        '<td><div style="display:flex;align-items:center;gap:12px;">' + imgTag + '<div><div class="item-name">' + item.name_en + '</div></div></div></td>' +
        '<td><div class="item-cat">' + catLabel(item.category) + '</div></td>' +
        '<td style="color:rgba(255,255,255,.5);font-size:.8rem">' + (item.section || '—') + '</td>' +
        '<td style="font-weight:700;color:var(--gold)">' + fmt(item.price) + '</td>' +
        '<td>' + vegBadge + '</td>' +
        '<td><button class="toggle-btn ' + toggleCls + '" onclick="toggleAvail(' + item.id + ',' + item.is_available + ')" title="' + (item.is_available==1?'Available':'Unavailable') + '"></button></td>' +
        '<td><div class="action-cell">' +
          '<button class="btn btn-ghost btn-sm" onclick="openEdit(' + item.id + ')">✏️ Edit</button>' +
          '<button class="btn btn-red btn-sm" onclick="deleteItem(' + item.id + ',\'' + item.name_en.replace(/'/g,"\\'") + '\')">🗑</button>' +
        '</div></td>' +
      '</tr>';
    }).join('');
  }

  function filterTable() {
    var q = document.getElementById('searchInput').value.trim().toLowerCase();
    if (!q) { renderTable(allItems); return; }
    renderTable(allItems.filter(function(i){
      return i.name_en.toLowerCase().includes(q)
          || (i.name_hi||'').toLowerCase().includes(q)
          || (i.section||'').toLowerCase().includes(q)
          || catLabel(i.category).toLowerCase().includes(q);
    }));
  }

  async function toggleAvail(id, current) {
    var newVal = current == 1 ? 0 : 1;
    try {
      var res = await fetch(API, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id: id, is_available: newVal }) });
      var d   = await res.json();
      if (!d.success) throw new Error(d.error);
      var item = allItems.find(function(i){ return i.id == id; });
      if (item) item.is_available = newVal;
      var btn = document.querySelector('#row-' + id + ' .toggle-btn');
      if (btn) { btn.className = 'toggle-btn ' + (newVal ? 'on' : 'off'); btn.title = newVal ? 'Available' : 'Unavailable'; }
      showToast(newVal ? '✅ Marked available' : '⛔ Marked unavailable');
    } catch(e) { showToast('Error: ' + e.message, 'error'); }
  }

  function openAdd() {
    editId = null;
    document.getElementById('modalTitle').textContent = 'Add Menu Item';
    ['fNameEn','fNameHi','fNameMr','fSection'].forEach(function(id){ document.getElementById(id).value = ''; });
    document.getElementById('fPrice').value = '';
    document.getElementById('fPrepTime').value = '10';
    document.getElementById('fSortOrder').value = '0';
    document.getElementById('fCategory').value = 'starter';
    document.getElementById('fIsVeg').value = '1';
    
    // Reset image fields
    document.getElementById('fImagePath').value = '';
    document.getElementById('fImageFile').value = '';
    document.getElementById('uploadPreviewWrap').style.display = 'none';
    document.getElementById('uploadLoader').style.display = 'none';
    
    document.getElementById('itemModal').classList.add('open');
  }

  function openEdit(id) {
    var item = allItems.find(function(i){ return i.id == id; });
    if (!item) return;
    editId = id;
    document.getElementById('modalTitle').textContent = 'Edit Menu Item';
    document.getElementById('fNameEn').value    = item.name_en || '';
    document.getElementById('fNameHi').value    = item.name_hi || '';
    document.getElementById('fNameMr').value    = item.name_mr || '';
    document.getElementById('fCategory').value  = item.category || 'starter';
    document.getElementById('fPrice').value     = item.price || '';
    document.getElementById('fSection').value   = item.section || '';
    document.getElementById('fIsVeg').value     = item.is_veg != null ? String(item.is_veg) : '1';
    document.getElementById('fPrepTime').value  = item.prep_time_min || 10;
    document.getElementById('fSortOrder').value = item.sort_order || 0;
    
    // Set image fields
    document.getElementById('fImageFile').value = '';
    document.getElementById('uploadLoader').style.display = 'none';
    if (item.image_path) {
      document.getElementById('fImagePath').value = item.image_path;
      document.getElementById('uploadPreview').src = item.image_path;
      document.getElementById('uploadPreviewWrap').style.display = 'flex';
    } else {
      document.getElementById('fImagePath').value = '';
      document.getElementById('uploadPreviewWrap').style.display = 'none';
    }
    
    document.getElementById('itemModal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('itemModal').classList.remove('open');
  }

  async function uploadImage(input) {
    var file = input.files[0];
    if (!file) return;

    // Client-side type validation
    if (!file.type.match('image.*')) {
      showToast('Please select a valid image file.', 'error');
      input.value = '';
      return;
    }

    var loader = document.getElementById('uploadLoader');
    loader.style.display = 'flex';

    var formData = new FormData();
    formData.append('image', file);

    try {
      var res = await fetch('api/upload_image.php', {
        method: 'POST',
        body: formData
      });
      var d = await res.json();
      loader.style.display = 'none';
      if (!d.success) throw new Error(d.error);

      document.getElementById('fImagePath').value = d.image_path;
      document.getElementById('uploadPreview').src = d.image_path;
      document.getElementById('uploadPreviewWrap').style.display = 'flex';
      showToast('✅ Image uploaded successfully!');
    } catch(e) {
      loader.style.display = 'none';
      input.value = '';
      showToast('Upload failed: ' + e.message, 'error');
    }
  }

  function removeUploadedImg(e) {
    if (e) e.stopPropagation();
    document.getElementById('fImagePath').value = '';
    document.getElementById('fImageFile').value = '';
    document.getElementById('uploadPreviewWrap').style.display = 'none';
    showToast('🗑️ Image removed.');
  }

  async function saveItem() {
    var nameEn = document.getElementById('fNameEn').value.trim();
    var price  = document.getElementById('fPrice').value.trim();
    if (!nameEn || !price) { showToast('Name and price are required.', 'error'); return; }

    var payload = {
      name_en:      nameEn,
      name_hi:      document.getElementById('fNameHi').value.trim(),
      name_mr:      document.getElementById('fNameMr').value.trim(),
      category:     document.getElementById('fCategory').value,
      price:        parseFloat(price),
      section:      document.getElementById('fSection').value.trim(),
      is_veg:       parseInt(document.getElementById('fIsVeg').value),
      prep_time_min:parseInt(document.getElementById('fPrepTime').value) || 10,
      sort_order:   parseInt(document.getElementById('fSortOrder').value) || 0,
      image_path:   document.getElementById('fImagePath').value.trim()
    };

    try {
      var method = editId ? 'PUT' : 'POST';
      if (editId) payload.id = editId;
      var res = await fetch(API, { method: method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      var d   = await res.json();
      if (!d.success) throw new Error(d.error);
      showToast(editId ? '✅ Item updated!' : '✅ Item added!');
      closeModal();
      loadMenu();
    } catch(e) { showToast('Error: ' + e.message, 'error'); }
  }

  async function deleteItem(id, name) {
    if (!confirm('Delete "' + name + '"? This cannot be undone.')) return;
    try {
      var res = await fetch(API + '?id=' + id, { method:'DELETE' });
      var d   = await res.json();
      if (!d.success) throw new Error(d.error);
      showToast('🗑 Item deleted.');
      loadMenu();
    } catch(e) { showToast('Error: ' + e.message, 'error'); }
  }

  // Close modal on backdrop click
  document.getElementById('itemModal').addEventListener('click', function(e){
    if (e.target === this) closeModal();
  });

  document.addEventListener('DOMContentLoaded', loadMenu);
</script>
</body>
</html>
