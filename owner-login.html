<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Owner Login – Hotel Tulsi</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <meta name="description" content="Secure owner portal for Hotel Tulsi management system."/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #FFD700;
      --gold-light: #FFE96B;
      --gold-dark: #B8860B;
      --white: #ffffff;
      --glass-bg: rgba(0,0,0,0.65);
      --glass-border: rgba(255,215,0,0.35);
      --input-bg: rgba(255,255,255,0.07);
      --input-border: rgba(255,215,0,0.30);
      --error: #ff4f4f;
      --success: #4cff91;
    }

    html, body {
      height: 100%;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      background-color: #0a0703;
      color: #fff;
    }

    /* ── Background ── */
    .bg {
      position: fixed;
      inset: 0;
      background: url('ALL Images/Final BG Tulsi.webp') center/cover no-repeat;
      z-index: 0;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(20,15,5,0.75) 0%, rgba(5,3,1,0.92) 100%);
      z-index: 1;
    }

    /* ── Main wrapper ── */
    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 10px;
    }

    /* ── Header texts ── */
    .ganesh-text {
      font-size: 1rem;
      color: var(--white);
      letter-spacing: 2px;
      text-align: center;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 0.8s ease-out 0.1s forwards;
    }

    .hotel-name {
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 800;
      letter-spacing: 4px;
      text-align: center;
      text-transform: uppercase;
      opacity: 0;
      transform: scale(0.7);
      animation: zoomIn 1s ease-out 0.4s forwards, shimmer 3.5s linear 1.5s infinite;
      background: linear-gradient(90deg, #fff 0%, #FFD700 30%, #fff 50%, #FFD700 70%, #fff 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--gold);
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 0.8s forwards;
    }

    /* ── Login Card ── */
    .card {
      margin-top: 14px;
      width: 100%;
      max-width: 400px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--glass-border);
      border-radius: 22px;
      padding: 34px 30px 28px;
      opacity: 0;
      transform: translateY(40px);
      animation: slideUpCard 0.9s ease-out 1s forwards;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(255,215,0,0.12);
    }

    .card-heading {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--white);
      text-align: center;
      margin-bottom: 22px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* ── Form elements ── */
    .input-group {
      margin-bottom: 18px;
      position: relative;
    }
    .input-label {
      display: block;
      font-size: 0.72rem;
      color: rgba(255,215,0,0.85);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .password-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    input[type="password"],
    input[type="text"] {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 13px 44px 13px 16px;
      color: var(--white);
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    input::placeholder { color: rgba(255,255,255,0.3); }
    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(255,215,0,0.2);
    }

    .toggle-pass-btn {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: rgba(255,215,0,0.75);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .toggle-pass-btn:hover { color: var(--gold-light); }

    /* ── Buttons ── */
    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.5px;
      margin-top: 6px;
    }
    .btn-gold {
      background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
      color: #140d02;
      box-shadow: 0 6px 20px rgba(255,215,0,0.35);
    }
    .btn-gold:hover:not(:disabled) {
      background: linear-gradient(135deg, #FFE96B 0%, #FFB700 100%);
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(255,215,0,0.5);
    }
    .btn-gold:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ── Messages ── */
    .msg {
      font-size: 0.82rem;
      text-align: center;
      padding: 10px 14px;
      border-radius: 10px;
      margin-top: 14px;
      font-weight: 500;
      display: none;
    }
    .msg.show { display: block; }
    .msg.error {
      color: #ff6b6b;
      background: rgba(255,79,79,0.15);
      border: 1px solid rgba(255,79,79,0.35);
    }
    .msg.success {
      color: #4ade80;
      background: rgba(74,222,128,0.12);
      border: 1px solid rgba(74,222,128,0.35);
    }

    .footer-note {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.4);
      text-align: center;
      margin-top: 20px;
      letter-spacing: 0.5px;
    }

    /* ── Keyframes ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.7); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes slideUpCard {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0%   { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    @media (max-width: 480px) {
      .card { padding: 28px 20px 22px; }
      html, body { overflow: auto; }
    }
  </style>
</head>
<body>

  <!-- Background -->
  <div class="bg"></div>
  <div class="overlay"></div>

  <!-- Page content -->
  <div class="page">

    <!-- Header -->
    <p class="ganesh-text">🕉️ &nbsp;श्री गणेशाय नमः&nbsp; 🕉️</p>
    <h1 class="hotel-name">Hotel Tulsi</h1>
    <p class="subtitle">Owner Management System</p>

    <!-- Login Card -->
    <div class="card" id="loginCard">
      <h2 class="card-heading">🔐 Owner Login</h2>

      <!-- Password form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="input-group">
          <label class="input-label" for="passwordInput">Owner Master Password</label>
          <div class="password-wrap">
            <input 
              type="password" 
              id="passwordInput" 
              placeholder="Enter master password" 
              required 
              autocomplete="current-password" 
              autofocus
            />
            <button type="button" class="toggle-pass-btn" onclick="togglePasswordVisibility()" title="Show/Hide Password">
              <span id="passIcon">👁️</span>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-gold" id="loginBtn">
          Unlock Dashboard →
        </button>
      </form>

      <!-- Feedback Messages -->
      <div class="msg error" id="errorMsg"></div>
      <div class="msg success" id="successMsg"></div>

      <p class="footer-note">👑 Authorized Personnel Only • Hotel Tulsi</p>
    </div>

  </div><!-- /.page -->

  <script src="owner-auth.js"></script>
  <script>
    'use strict';

    // If already logged in, redirect straight to dashboard
    if (window.OwnerAuth && window.OwnerAuth.isLoggedIn()) {
      const redirectUrl = (new URLSearchParams(window.location.search)).get('redirect') || 'dashboard.html';
      window.location.replace(redirectUrl);
    }

    function togglePasswordVisibility() {
      const inp = document.getElementById('passwordInput');
      const icon = document.getElementById('passIcon');
      if (inp.type === 'password') {
        inp.type = 'text';
        icon.textContent = '🙈';
      } else {
        inp.type = 'password';
        icon.textContent = '👁️';
      }
    }

    function showMsg(type, text) {
      const err = document.getElementById('errorMsg');
      const succ = document.getElementById('successMsg');
      err.classList.remove('show');
      succ.classList.remove('show');

      if (type === 'error') {
        err.textContent = text;
        err.classList.add('show');
      } else if (type === 'success') {
        succ.textContent = text;
        succ.classList.add('show');
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const pass = document.getElementById('passwordInput').value;
      const btn = document.getElementById('loginBtn');

      btn.disabled = true;
      btn.textContent = 'Verifying…';

      setTimeout(() => {
        const res = window.OwnerAuth.login(pass);
        if (res.success) {
          showMsg('success', '✅ Access Granted! Opening Dashboard…');
          const redirectUrl = (new URLSearchParams(window.location.search)).get('redirect') || 'dashboard.html';
          setTimeout(() => {
            window.location.replace(redirectUrl);
          }, 600);
        } else {
          showMsg('error', '❌ Incorrect password. Access denied.');
          btn.disabled = false;
          btn.textContent = 'Unlock Dashboard →';
          document.getElementById('passwordInput').focus();
          document.getElementById('passwordInput').select();
        }
      }, 350);
    }
  </script>
</body>
</html>
