<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
  <title>Golden Stone Hotel | Your Table</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --gold-200:#fef3c7;--gold-300:#f5d48a;--gold-400:#e8c56a;
      --gold-500:#d4a832;--gold-600:#b8901e;--gold-700:#8b6914;
      --stone-950:#080500;--stone-900:#100c04;--stone-800:#1a1408;
      --stone-700:#251c0c;--stone-600:#332810;
      --gold-glow:rgba(212,168,50,.5);
      --ff-serif:'Playfair Display',Georgia,serif;
      --ff-cinzel:'Cinzel','Times New Roman',serif;
      --ff-body:'Inter','Helvetica Neue',sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{height:100%;font-size:16px}
    body{
      font-family:var(--ff-body);color:#fff;min-height:100dvh;
      background:var(--stone-950);overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
    }

    /* ── BG ── */
    .bg{position:fixed;inset:0;z-index:0;overflow:hidden}
    .bg img{width:100%;height:100%;object-fit:cover;filter:brightness(.35) saturate(.8);animation:bgZoom 30s ease-in-out infinite alternate}
    @keyframes bgZoom{from{transform:scale(1)}to{transform:scale(1.08)}}
    .bg-grad{
      position:absolute;inset:0;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%,rgba(180,130,20,.18) 0%,transparent 70%),
        linear-gradient(to bottom,rgba(8,5,0,.5) 0%,rgba(8,5,0,.2) 40%,rgba(4,3,0,.95) 100%);
    }
    .bg-stone{
      position:absolute;inset:0;
      background-image:
        repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0px,rgba(255,255,255,.012) 1px,transparent 1px,transparent 48px),
        repeating-linear-gradient(90deg,rgba(255,255,255,.008) 0px,rgba(255,255,255,.008) 1px,transparent 1px,transparent 64px);
      opacity:.6;
    }

    /* ── PARTICLES ── */
    .particles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
    .particle{
      position:absolute;border-radius:50%;
      background:var(--gold-300);opacity:0;
      animation:floatUp var(--dur,10s) var(--delay,0s) ease-in infinite;
    }
    @keyframes floatUp{
      0%{transform:translateY(0) scale(1);opacity:0}
      8%{opacity:.5}85%{opacity:.1}
      100%{transform:translateY(-105vh) scale(.2);opacity:0}
    }

    /* ── WRAP ── */
    .wrap{
      position:relative;z-index:2;min-height:100dvh;
      display:flex;flex-direction:column;align-items:center;
      padding:2.5rem 1.2rem 4rem;
      opacity:0;animation:pageIn 1s .1s cubic-bezier(.22,1,.36,1) forwards;
    }
    @keyframes pageIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

    /* ── HEADER ── */
    header{width:100%;text-align:center;margin-bottom:3rem}

    .back-btn{
      position:absolute;top:1.5rem;left:1.2rem;
      background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
      color:rgba(255,255,255,.55);font-family:var(--ff-body);font-size:.78rem;
      letter-spacing:.06em;padding:.45rem .95rem;border-radius:100px;
      cursor:pointer;backdrop-filter:blur(12px);transition:.25s ease;
      text-decoration:none;display:inline-flex;align-items:center;gap:.35rem;
    }
    .back-btn:hover{background:rgba(255,255,255,.14);color:#fff}

    .crest{display:flex;align-items:center;justify-content:center;gap:.6rem;margin-bottom:1rem}
    .crest-line{width:48px;height:1px;background:linear-gradient(to right,transparent,var(--gold-400))}
    .crest-line:last-child{background:linear-gradient(to left,transparent,var(--gold-400))}
    .crest-star{font-size:.9rem;color:var(--gold-400);filter:drop-shadow(0 0 6px var(--gold-glow));animation:spin 18s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .brand{
      font-family:var(--ff-cinzel);font-size:clamp(1.1rem,4vw,1.6rem);
      font-weight:700;letter-spacing:.18em;
      background:linear-gradient(135deg,var(--gold-300),var(--gold-500),var(--gold-200),var(--gold-400));
      -webkit-background-clip:text;background-clip:text;color:transparent;
      filter:drop-shadow(0 0 18px rgba(212,168,50,.4));
      margin-bottom:.3rem;
    }
    .brand-rule{
      width:60px;height:1px;margin:.5rem auto .7rem;
      background:linear-gradient(to right,transparent,var(--gold-500),transparent);
    }
    .brand-tagline{
      font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;
      color:rgba(255,255,255,.35);
    }

    /* ── CARD ── */
    .card{
      width:100%;max-width:420px;
      background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
      border:1px solid rgba(212,168,50,.25);border-radius:28px;
      backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
      box-shadow:0 0 60px rgba(212,168,50,.1),0 24px 60px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.1);
      padding:2.4rem 2rem 2.2rem;
      position:relative;overflow:hidden;
    }
    .card::before{
      content:'';position:absolute;top:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,rgba(212,168,50,.6),transparent);
    }
    .card-icon{font-size:2.2rem;text-align:center;margin-bottom:.8rem;filter:drop-shadow(0 0 12px var(--gold-glow))}
    .card-title{
      font-family:var(--ff-serif);font-size:clamp(1.2rem,4vw,1.6rem);
      font-weight:400;font-style:italic;text-align:center;
      color:rgba(255,255,255,.9);margin-bottom:.4rem;
    }
    .card-sub{
      font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
      color:rgba(255,255,255,.38);text-align:center;margin-bottom:2rem;
    }

    /* ── INPUT GROUP ── */
    .input-group{position:relative;margin-bottom:1.6rem}
    .input-label{
      display:block;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
      color:var(--gold-400);margin-bottom:.6rem;font-weight:500;
    }
    .table-input{
      width:100%;padding:1.1rem 1.2rem 1.1rem 3.4rem;
      background:rgba(255,255,255,.06);
      border:1.5px solid rgba(212,168,50,.3);border-radius:14px;
      color:#fff;font-family:var(--ff-cinzel);font-size:1.6rem;
      font-weight:600;letter-spacing:.12em;text-align:center;
      outline:none;transition:.3s ease;
      -webkit-appearance:none;appearance:none;
    }
    .table-input::placeholder{color:rgba(255,255,255,.2);font-size:1rem;letter-spacing:.1em}
    .table-input:focus{
      border-color:var(--gold-400);
      background:rgba(212,168,50,.07);
      box-shadow:0 0 0 3px rgba(212,168,50,.15),0 0 30px rgba(212,168,50,.12);
    }
    .input-icon{
      position:absolute;left:1.1rem;top:50%;transform:translateY(-50%);
      font-size:1.2rem;pointer-events:none;
    }

    /* ── PRIMARY BUTTON ── */
    .btn-primary{
      width:100%;padding:1rem;border-radius:14px;
      background:linear-gradient(135deg,var(--gold-500),var(--gold-600),var(--gold-700));
      color:var(--stone-950);font-family:var(--ff-cinzel);font-size:.95rem;
      font-weight:700;letter-spacing:.1em;border:none;cursor:pointer;
      box-shadow:0 0 28px rgba(212,168,50,.4),0 8px 24px rgba(0,0,0,.4);
      transition:.3s cubic-bezier(.34,1.56,.64,1);
      position:relative;overflow:hidden;
    }
    .btn-primary::before{
      content:'';position:absolute;top:-60%;left:-80%;
      width:60%;height:200%;
      background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);
      transform:skewX(-20deg);transition:left .55s cubic-bezier(.22,1,.36,1);
    }
    .btn-primary:hover::before{left:140%}
    .btn-primary:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 0 44px rgba(212,168,50,.6),0 12px 32px rgba(0,0,0,.5)}
    .btn-primary:active{transform:scale(.97)}

    /* ── STEP CONTAINER ── */
    .step-container{
      width:100%;max-width:420px;
      position:relative;
    }
    /* ── PERSONS SECTION (hidden initially) ── */
    .persons-section{
      width:100%;max-width:420px;
      opacity:0;transform:scale(.96);
      transition:opacity .55s cubic-bezier(.22,1,.36,1),transform .55s cubic-bezier(.22,1,.36,1);
      pointer-events:none;
      display:none;
    }
    .persons-section.visible{opacity:1;transform:none;pointer-events:all;display:block}
    /* card exit */
    .card.exit{
      opacity:0;transform:scale(.94);
      transition:opacity .4s ease,transform .4s ease;
      pointer-events:none;
    }

    /* removed divider — no longer needed */

    .persons-card{
      width:100%;
      background:linear-gradient(160deg,rgba(212,168,50,.1),rgba(212,168,50,.04));
      border:1px solid rgba(212,168,50,.3);border-radius:24px;
      backdrop-filter:blur(24px);
      box-shadow:0 0 40px rgba(212,168,50,.08),0 16px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(212,168,50,.15);
      padding:2rem 1.8rem;
      position:relative;overflow:hidden;
    }
    .persons-card::before{
      content:'';position:absolute;top:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,rgba(212,168,50,.5),transparent);
    }
    .table-badge{
      display:inline-flex;align-items:center;gap:.4rem;
      background:rgba(212,168,50,.15);border:1px solid rgba(212,168,50,.35);
      border-radius:100px;padding:.3rem .9rem;
      font-family:var(--ff-cinzel);font-size:.7rem;letter-spacing:.12em;
      color:var(--gold-300);margin-bottom:1.2rem;
    }
    .persons-title{
      font-family:var(--ff-serif);font-size:clamp(1.1rem,3.5vw,1.4rem);
      font-weight:700;color:#fff;margin-bottom:.35rem;
    }
    .persons-sub{font-size:.75rem;color:rgba(255,255,255,.45);line-height:1.6;margin-bottom:1.8rem}

    /* ── PERSONS COUNTER ── */
    .counter-wrap{display:flex;align-items:center;justify-content:center;gap:1.2rem;margin-bottom:1.8rem}
    .counter-btn{
      width:52px;height:52px;border-radius:50%;
      background:rgba(255,255,255,.08);border:1.5px solid rgba(212,168,50,.35);
      color:var(--gold-300);font-size:1.4rem;font-weight:300;
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      transition:.25s cubic-bezier(.34,1.56,.64,1);
    }
    .counter-btn:hover{background:rgba(212,168,50,.15);border-color:var(--gold-400);transform:scale(1.12)}
    .counter-btn:active{transform:scale(.93)}
    .counter-display{
      font-family:var(--ff-cinzel);font-size:3.5rem;font-weight:700;
      color:var(--gold-300);filter:drop-shadow(0 0 16px var(--gold-glow));
      width:5.5rem;text-align:center;line-height:1;
      background:transparent;border:none;outline:none;
      border-bottom:2px solid rgba(212,168,50,.35);
      padding:.1rem .2rem;
      -moz-appearance:textfield;
      transition:transform .2s cubic-bezier(.34,1.56,.64,1), border-color .2s ease;
    }
    .counter-display::-webkit-outer-spin-button,
    .counter-display::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
    .counter-display:focus{
      border-bottom-color:var(--gold-400);
      filter:drop-shadow(0 0 20px var(--gold-glow));
    }
    .counter-display.bump{transform:scale(1.25)}
    .counter-display.error{
      border-bottom-color:#ff5555;
      color:#ff5555;
      filter:drop-shadow(0 0 14px rgba(255,60,60,.6));
      animation:shake .35s ease;
    }
    @keyframes shake{
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-6px)}
      40%{transform:translateX(6px)}
      60%{transform:translateX(-4px)}
      80%{transform:translateX(4px)}
    }

    .persons-hint{
      font-size:.65rem;letter-spacing:.1em;text-align:center;
      color:rgba(255,255,255,.3);margin-bottom:1.6rem;
      text-transform:uppercase;
    }

    .btn-confirm{
      width:100%;padding:1.05rem;border-radius:14px;
      background:linear-gradient(135deg,#7c5a10,var(--gold-600),var(--gold-500));
      color:#fff8e1;font-family:var(--ff-cinzel);font-size:.9rem;
      font-weight:700;letter-spacing:.12em;border:none;cursor:pointer;
      box-shadow:0 0 32px rgba(212,168,50,.35),0 8px 24px rgba(0,0,0,.5);
      transition:.3s cubic-bezier(.34,1.56,.64,1);
      position:relative;overflow:hidden;
    }
    .btn-confirm:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 0 48px rgba(212,168,50,.55)}
    .btn-confirm:active{transform:scale(.97)}

    /* ── TOAST ── */
    .toast{
      position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(20px);
      background:rgba(20,16,8,.95);border:1px solid rgba(212,168,50,.4);
      border-radius:100px;padding:.6rem 1.4rem;
      font-size:.75rem;letter-spacing:.06em;color:var(--gold-300);
      opacity:0;transition:.35s ease;z-index:999;white-space:nowrap;
      backdrop-filter:blur(16px);
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* ── RESPONSIVE ── */
    @media(max-width:400px){
      .card,.persons-card{padding:1.8rem 1.4rem}
      .counter-display{font-size:3rem}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>

  <!-- BG -->
  <div class="bg">
    <img src="ALL Images/HOTEL Main BG.webp" alt="Golden Stone Hotel"
      onerror="this.style.display='none'"/>
    <div class="bg-grad"></div>
    <div class="bg-stone"></div>
  </div>

  <!-- PARTICLES -->
  <div class="particles" id="particles"></div>

  <!-- WRAP -->
  <div class="wrap">

    <a href="index.html" class="back-btn">← Back</a>

    <!-- HEADER -->
    <header>
      <div class="crest">
        <div class="crest-line"></div>
        <span class="crest-star">✦</span>
        <div class="crest-line"></div>
      </div>
      <div class="brand">GOLDEN STONE</div>
      <div class="brand-rule"></div>

    </header>

    <!-- STEP CONTAINER: table card and persons section share same space -->
    <div class="step-container">

      <!-- TABLE NUMBER CARD -->
      <div class="card" id="tableCard">
        <div class="card-icon">🍽️</div>
        <h1 class="card-title">Select Your Table</h1>
        <p class="card-sub">Enter your table number to continue</p>

        <div class="input-group">
          <label class="input-label" for="tableInput">Table Number</label>
          <span class="input-icon">🪑</span>
          <input
            class="table-input"
            id="tableInput"
            type="number"
            min="1" max="99"
            placeholder="e.g. 5"
            inputmode="numeric"
            autocomplete="off"
            aria-label="Enter your table number"
          />
        </div>

        <button class="btn-primary" id="tableSubmitBtn" onclick="handleTableSubmit()">
          ✦ &nbsp;Confirm Table &nbsp;✦
        </button>
      </div>

      <!-- PERSONS SECTION (replaces table card in same spot) -->
      <div class="persons-section" id="personsSection">
        <div class="persons-card">
          <div class="table-badge" onclick="showTableCard()" title="Click to change table" style="cursor:pointer;" role="button" tabindex="0">
            <span id="badgeTablePrefix">🪑 &nbsp;Table</span> &nbsp;<span id="badgeTableNum">—</span>
            <span style="font-size:0.65rem;opacity:0.75;margin-left:0.35rem;border-left:1px solid rgba(212,168,50,0.4);padding-left:0.45rem;">✏️ Edit</span>
          </div>
          <p class="persons-title">How many guests at your table?</p>

          <div class="counter-wrap">
            <button class="counter-btn" id="decrementBtn" onclick="changeCount(-1)" aria-label="Decrease count">−</button>
            <input
              class="counter-display"
              id="counterDisplay"
              type="number"
              min="1" max="30"
              value="1"
              inputmode="numeric"
              autocomplete="off"
              aria-label="Number of guests"
            />
            <button class="counter-btn" id="incrementBtn" onclick="changeCount(1)" aria-label="Increase count">+</button>
          </div>

          <p class="persons-hint" id="personsHint">1 guest</p>

          <button class="btn-confirm" id="confirmBtn" onclick="handleConfirm()">
            Proceed to Order →
          </button>
        </div>
      </div>

    </div><!-- /step-container -->

  </div><!-- /wrap -->

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script>
    'use strict';

    /* ── LANGUAGE STRINGS ── */

        cardSub:      '\u092a\u0941\u0922\u0947 \u091c\u093e\u0923\u094d\u092f\u093e\u0938\u093e\u0920\u0940 \u091f\u0947\u092c\u0932 \u0928\u0902\u092c\u0930 \u091f\u093e\u0915\u093e',

        proceedBtn:   '\u0911\u0930\u094d\u0921\u0930\u0915\u0921\u0947 \u092a\u0941\u0922\u0947 \u091c\u093e \u2192',
        guest1:       '1 \u092a\u093e\u0939\u0941\u0923\u093e',
        guestN:       '\u092a\u093e\u0939\u0941\u0923\u0947',
        toastInvalid: '\u26a0\ufe0f \u0915\u0943\u092a\u092f\u093e \u0935\u0948\u0927 \u091f\u0947\u092c\u0932 \u0928\u0902\u092c\u0930 \u091f\u093e\u0915\u093e (1\u201399)',
        toastNoTable: '\u26a0\ufe0f \u0915\u0943\u092a\u092f\u093e \u0906\u0927\u0940 \u091f\u0947\u092c\u0932 \u0928\u093f\u0936\u094d\u091a\u093f\u0924 \u0915\u0930\u093e',
      },
    };

    /* ── INIT ── */
    const params = new URLSearchParams(location.search);
    const lang   = params.get('lang') || sessionStorage.getItem('hotel_lang') || 'en';
    const str    = STRINGS[lang] || STRINGS.en;

    /* ── APPLY LANGUAGE TO DOM ── */
    document.querySelector('.card-title').textContent   = str.cardTitle;
    document.querySelector('.card-sub').textContent     = str.cardSub;
    document.querySelector('.input-label').textContent  = str.inputLabel;
    document.getElementById('tableInput').placeholder   = str.placeholder;
    document.getElementById('tableSubmitBtn').textContent = str.confirmBtn;
    document.querySelector('.persons-title').textContent  = str.personsTitle;
    document.getElementById('confirmBtn').textContent     = str.proceedBtn;
    document.getElementById('personsHint').textContent    = str.guest1;

    /* ── STATE ── */
    let tableNum    = null;
    let personCount = 1;

    /* ── AUTO-DETECT TABLE FROM QR ── */
    const urlTable = params.get('table') || sessionStorage.getItem('hotel_table');
    if (urlTable) {
      const parsed = parseInt(urlTable, 10);
      if (parsed >= 1 && parsed <= 99) {
        tableNum = parsed;
        sessionStorage.setItem('hotel_table', tableNum);
        document.getElementById('tableInput').value = tableNum;
        document.getElementById('badgeTableNum').textContent = tableNum;
        const pfx = document.getElementById('badgeTablePrefix');
        if (pfx) pfx.textContent = '\ud83e\ude91\u00a0 ' + str.tableWord;

        const card = document.getElementById('tableCard');
        const sec  = document.getElementById('personsSection');
        card.style.display = 'none';
        sec.style.display  = 'block';
        sec.classList.add('visible');
      }
    }

    /* ── TOAST ── */
    function showToast(msg){
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    /* ── CHANGE / RE-ENTER TABLE ── */
    function showTableCard(){
      const card = document.getElementById('tableCard');
      const sec  = document.getElementById('personsSection');
      sec.classList.remove('visible');
      setTimeout(() => {
        sec.style.display = 'none';
        card.style.display = 'block';
        card.classList.remove('exit');
        const inp = document.getElementById('tableInput');
        inp.focus();
        inp.select();
      }, 200);
    }

    /* ── TABLE SUBMIT ── */
    function handleTableSubmit(){
      const inp = document.getElementById('tableInput');
      const val = parseInt(inp.value, 10);
      if(!val || val < 1 || val > 99){
        showToast(str.toastInvalid);
        inp.focus();
        return;
      }
      tableNum = val;
      sessionStorage.setItem('hotel_table', tableNum);
      document.getElementById('badgeTableNum').textContent = tableNum;
      // badge prefix in correct language
      const pfx = document.getElementById('badgeTablePrefix');
      if (pfx) pfx.textContent = '\ud83e\ude91\u00a0 ' + str.tableWord;

      const card = document.getElementById('tableCard');
      const sec  = document.getElementById('personsSection');
      card.classList.add('exit');
      setTimeout(() => {
        card.style.display = 'none';
        sec.style.display  = 'block';
        sec.getBoundingClientRect();
        sec.classList.add('visible');
      }, 420);
    }

    /* ── PERSONS COUNTER ── */
    function changeCount(delta){
      const inp  = document.getElementById('counterDisplay');
      const next = personCount + delta;
      if(next < 1 || next > 30) return;
      personCount = next;
      inp.value = personCount;
      inp.classList.add('bump');
      setTimeout(() => inp.classList.remove('bump'), 200);
      document.getElementById('personsHint').textContent =
        personCount === 1 ? str.guest1 : personCount + ' ' + str.guestN;
    }

    /* sync personCount when user types manually */
    document.getElementById('counterDisplay').addEventListener('input', function(){
      const v = parseInt(this.value, 10);
      if(isNaN(v) || v < 1){
        // mark invalid — do NOT update personCount, do NOT navigate
        setCounterError(true);
        document.getElementById('personsHint').textContent = '';
        return;
      }
      setCounterError(false);
      personCount = Math.min(v, 30);
      if(v > 30) this.value = 30;
      document.getElementById('personsHint').textContent =
        personCount === 1 ? str.guest1 : personCount + ' ' + str.guestN;
    });

    /* on blur: if still invalid, keep field empty + error state; else clamp */
    document.getElementById('counterDisplay').addEventListener('blur', function(){
      const v = parseInt(this.value, 10);
      if(isNaN(v) || v < 1){
        showToast('⚠️ Please enter correct information');
        setCounterError(true);
        this.value = '';   // keep empty so user knows they must fill it
        document.getElementById('personsHint').textContent = '';
        return;
      }
      personCount = Math.min(v, 30);
      this.value   = personCount;
      setCounterError(false);
      document.getElementById('personsHint').textContent =
        personCount === 1 ? str.guest1 : personCount + ' ' + str.guestN;
    });

    function setCounterError(on){
      const inp = document.getElementById('counterDisplay');
      if(on){
        inp.classList.add('error');
        // re-trigger animation each time
        void inp.offsetWidth;
      } else {
        inp.classList.remove('error');
      }
    }

    /* ── CONFIRM ── */
    function handleConfirm(){
      if(!tableNum){ showToast(str.toastNoTable); return; }
      // validate live input before navigating
      const raw = parseInt(document.getElementById('counterDisplay').value, 10);
      if(isNaN(raw) || raw < 1){
        showToast('⚠️ Please enter correct information');
        setCounterError(true);
        document.getElementById('counterDisplay').focus();
        return;
      }
      personCount = Math.min(raw, 30);
      sessionStorage.setItem('hotel_table',   tableNum);
      sessionStorage.setItem('hotel_persons', personCount);
      sessionStorage.setItem('hotel_lang',    lang);

      // Register table occupancy in DB before proceeding
      fetch('api/occupy_table.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'occupy', table: tableNum, persons: personCount })
      }).finally(() => {
        window.location.href = 'menu.html?lang=' + encodeURIComponent(lang) + '&table=' + tableNum + '&persons=' + personCount;
      });
    }

    /* ── ENTER key on input ── */
    document.getElementById('tableInput').addEventListener('keydown', function(e){
      if(e.key === 'Enter') handleTableSubmit();
    });

    /* ── PARTICLES ── */
    (function(){
      const c = document.getElementById('particles');
      if(!c) return;
      for(let i = 0; i < 22; i++){
        const p = document.createElement('div');
        p.className = 'particle';
        const s = 1.5 + Math.random() * 2.5;
        p.style.setProperty('--dur',   (9 + Math.random() * 10) + 's');
        p.style.setProperty('--delay', (Math.random() * 12) + 's');
        p.style.left   = (Math.random() * 100) + '%';
        p.style.bottom = (-8 + Math.random() * 20) + '%';
        p.style.width  = p.style.height = s + 'px';
        c.appendChild(p);
      }
    })();
  </script>
</body>
</html>
