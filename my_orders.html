<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Golden Stone Hotel | My Orders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --gold-100: #fff9ed;
      --gold-200: #fef3c7;
      --gold-300: #f5d48a;
      --gold-400: #e8c56a;
      --gold-500: #d4a832;
      --gold-600: #b8901e;
      --stone-950: #080500;
      --gold-glow: rgba(212,168,50,.55);
      --ff-cinzel: 'Cinzel', 'Times New Roman', serif;
      --ff-body:   'Inter', 'Helvetica Neue', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: var(--ff-body);
      color: #fff;
      background: var(--stone-950);
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 5rem;
    }

    /* ── FIXED BG ── */
    .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .bg img {
      width: 100%; height: 100%; object-fit: cover;
      filter: brightness(.22) saturate(.7);
      animation: bgZoom 35s ease-in-out infinite alternate;
    }
    @keyframes bgZoom { from { transform: scale(1); } to { transform: scale(1.07); } }
    .bg-grad {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(8,5,0,.6) 0%, rgba(6,4,0,.3) 30%, rgba(4,3,0,.85) 100%);
    }

    /* ── TOPBAR ── */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      padding: .7rem 1.2rem .65rem;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(8,5,0,.75);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(212,168,50,.14);
    }
    .back-btn {
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16);
      color: rgba(255,255,255,.6); font-family: var(--ff-body); font-size: .76rem;
      letter-spacing: .06em; padding: .38rem .9rem; border-radius: 100px;
      cursor: pointer; backdrop-filter: blur(10px); transition: .25s ease;
      text-decoration: none; display: inline-flex; align-items: center; gap: .3rem;
      flex-shrink: 0;
    }
    .back-btn:hover { background: rgba(255,255,255,.15); color: #fff; }
    
    .topbar-title {
      font-family: var(--ff-cinzel); font-size: 1rem; font-weight: 700;
      letter-spacing: .15em;
      background: linear-gradient(135deg, var(--gold-300), var(--gold-500), var(--gold-200));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-align: center;
      flex: 1;
    }
    
    .topbar-right {
      font-family: var(--ff-cinzel); font-size: .75rem;
      color: rgba(255,255,255,.4); letter-spacing: .08em;
      flex-shrink: 0;
    }
    .topbar-right span { color: var(--gold-400); font-weight: 600; }

    /* ── CONTENT ── */
    .content { position: relative; z-index: 2; padding: 2rem 1.2rem; max-width: 800px; margin: 0 auto; }

    .empty-state {
      text-align: center; margin-top: 4rem;
      font-family: var(--ff-cinzel); font-size: 1.1rem;
      color: rgba(255,255,255,.4); letter-spacing: .1em;
      line-height: 1.5;
    }

    .order-list { display: flex; flex-direction: column; gap: 1rem; }
    .order-card {
      background: rgba(20,14,4,.72);
      border: 1px solid rgba(212,168,50,.18);
      border-radius: 16px;
      padding: 1rem 1.2rem;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 4px 24px rgba(0,0,0,.5);
      display: flex; justify-content: space-between; align-items: center;
    }
    .order-info { flex: 1; }
    .order-name {
      font-family: var(--ff-cinzel); font-size: 1.1rem; font-weight: 600;
      letter-spacing: .05em; color: #fff; margin-bottom: .3rem;
    }
    .order-qty {
      font-size: .8rem; color: rgba(255,255,255,.5);
    }
    .order-price {
      font-family: var(--ff-cinzel); font-size: 1.1rem; font-weight: 700;
      background: linear-gradient(135deg, var(--gold-300), var(--gold-500));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .total-section {
      margin-top: 2rem; padding-top: 1.2rem; display: flex; justify-content: center;
    }
    .view-bill-btn {
      background: linear-gradient(135deg, #2ecc40, #28b638);
      color: #fff; font-family: var(--ff-body); font-weight: 600;
      font-size: 1rem; letter-spacing: .08em; padding: .8rem 2rem;
      border: 1px solid rgba(46,204,64,.5); border-radius: 100px;
      cursor: pointer; box-shadow: 0 4px 16px rgba(46,204,64,.3);
      transition: transform .25s ease, box-shadow .25s ease;
      text-transform: uppercase; text-decoration: none;
    }
    .view-bill-btn:hover {
      transform: translateY(-2px); box-shadow: 0 6px 24px rgba(46,204,64,.4);
    }

    /* ── TASKBAR ── */
    .taskbar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
      background: rgba(10,7,2,.95); border-top: 1px solid rgba(212,168,50,.3);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      display: flex; align-items: center; justify-content: space-around;
      padding: .6rem 0 calc(.6rem + env(safe-area-inset-bottom, 0px));
      box-shadow: 0 -8px 32px rgba(0,0,0,.6);
    }
    .taskbar-btn {
      display: flex; flex-direction: column; align-items: center; gap: .2rem;
      text-decoration: none; color: rgba(255,255,255,.5);
      font-family: var(--ff-body); font-size: .65rem; letter-spacing: .05em;
      transition: color .25s ease, transform .2s ease; flex: 1; -webkit-tap-highlight-color: transparent;
    }
    .taskbar-icon { font-size: 1.2rem; margin-bottom: .1rem; }
    .taskbar-btn.active { color: var(--gold-400); }
    .taskbar-btn.active .taskbar-icon { filter: drop-shadow(0 0 6px var(--gold-glow)); }
    .taskbar-btn:hover { color: var(--gold-300); transform: translateY(-2px); }

    /* ── BILL POPUP ── */
    .bill-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,.75); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      display: flex; justify-content: center; align-items: center;
      padding: 1.5rem; opacity: 0; pointer-events: none;
      transition: opacity .35s ease;
    }
    .bill-overlay.show { opacity: 1; pointer-events: auto; }
    
    .bill-modal {
      background: #fdfcf8; color: #111;
      width: 100%; max-width: 380px;
      border-radius: 12px; padding: 2rem 1.5rem;
      box-shadow: 0 16px 40px rgba(0,0,0,.6);
      transform: translateY(30px) scale(0.95);
      transition: transform .4s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
    }
    .bill-overlay.show .bill-modal { transform: translateY(0) scale(1); }
    
    .bill-header { text-align: center; margin-bottom: 1.2rem; }
    .bill-brand { font-family: var(--ff-cinzel); font-size: 1.5rem; font-weight: 700; color: #000; letter-spacing: .05em; }
    .bill-address { font-size: .75rem; color: #444; margin-bottom: 1rem; font-family: var(--ff-body); text-transform: uppercase; letter-spacing: .15em; }
    .bill-divider { border-top: 1.5px dashed #ccc; margin: .8rem 0; }
    
    .bill-meta { display: flex; justify-content: space-between; font-size: .85rem; font-family: var(--ff-body); color: #333; font-weight: 600; margin: .8rem 0; }
    
    .bill-items { margin: 1.2rem 0; font-size: .9rem; line-height: 1.6; font-family: var(--ff-body); font-weight: 500; }
    .bill-item-row { display: flex; justify-content: space-between; margin-bottom: .6rem; }
    .bill-item-name { flex: 1; padding-right: 1rem; color: #222; }
    .bill-item-price { font-weight: 600; color: #000; }
    
    .bill-summary { font-size: .95rem; font-family: var(--ff-body); font-weight: 500; color: #333; }
    .bill-row { display: flex; justify-content: space-between; margin-bottom: .5rem; }
    .bill-total-row { font-size: 1.25rem; font-weight: 700; margin-top: .8rem; color: #000; }
    
    .bill-footer { text-align: center; margin-top: 1.8rem; font-size: .8rem; color: #555; font-family: var(--ff-body); }
    
    .close-bill-btn {
      width: 100%; margin-top: 1.8rem; padding: .9rem;
      background: #111; color: #fff; border: none; border-radius: 100px;
      font-family: var(--ff-body); font-weight: 600; font-size: .95rem;
      cursor: pointer; text-transform: uppercase; letter-spacing: .1em;
      transition: background .2s ease;
    }
    .close-bill-btn:hover { background: #333; }
  </style>
</head>
<body>
  <!-- FIXED BACKGROUND -->
  <div class="bg">
    <img src="ALL Images/Hotel BG 3.webp" alt="Golden Stone Hotel ambiance" onerror="this.style.display='none'"/>
    <div class="bg-grad"></div>
  </div>

  <!-- TOPBAR -->
  <div class="topbar">
    <a href="menu.html" class="back-btn" id="backBtn" onclick="passParamsToHome(event)">← Back</a>
    <div class="topbar-title" id="pageTitle">My Orders</div>
    <div class="topbar-right">T&nbsp;<span id="topTable">—</span></div>
  </div>

  <!-- CONTENT -->
  <div class="content" id="orderContent">
    <div class="empty-state" id="emptyState" style="display: none;">You have not ordered anything yet</div>
    <div class="order-list" id="orderList"></div>
    <div class="total-section" id="totalSection" style="display: none;">
      <button class="view-bill-btn" id="btnViewBill">View Bill</button>
    </div>
  </div>

  <!-- TASKBAR -->
  <div class="taskbar">
    <a href="menu.html" class="taskbar-btn" onclick="passParamsToHome(event)">
      <div class="taskbar-icon">🏠</div>
      <span id="txtHome">Home</span>
    </a>
    <a href="my_orders.html" class="taskbar-btn active">
      <div class="taskbar-icon">📝</div>
      <span id="txtMyOrder">My Orders</span>
    </a>
  </div>

  <!-- BILL POPUP -->
  <div class="bill-overlay" id="billOverlay">
    <div class="bill-modal">
      <div class="bill-header">
        <div class="bill-brand">GOLDEN STONE</div>
        <div class="bill-address">Luxury Hospitality</div>
        <div class="bill-divider"></div>
        <div class="bill-meta">
          <span id="billDate"></span>
          <span>Table <span id="billTableNum"></span></span>
        </div>
        <div class="bill-divider"></div>
      </div>
      
      <div class="bill-items" id="billItems"></div>
      
      <div class="bill-divider"></div>
      
      <div class="bill-summary">
        <div class="bill-row">
          <span id="txtSubtotal">Subtotal</span>
          <span id="billSubtotal">₹0</span>
        </div>
        <div class="bill-row">
          <span id="txtTax">Tax (5%)</span>
          <span id="billTax">₹0</span>
        </div>
        <div class="bill-divider"></div>
        <div class="bill-row bill-total-row">
          <span id="txtTotal">Total</span>
          <span id="billTotal">₹0</span>
        </div>
      </div>

      <div class="bill-footer">
        <div id="txtThankYou">Thank you for dining with us!</div>
        <div id="txtVisitAgain">Please visit again</div>
      </div>

      <button class="close-bill-btn" id="closeBillBtn">Close</button>
    </div>
  </div>

  <script>
    'use strict';
    /* ── Session params ── */
    const params  = new URLSearchParams(location.search);
    const lang    = params.get('lang')    || sessionStorage.getItem('hotel_lang')    || 'en';
    const table   = params.get('table')   || sessionStorage.getItem('hotel_table')   || '—';
    const persons = params.get('persons') || sessionStorage.getItem('hotel_persons') || '1';

    /* ── Language strings ── */
    const STRINGS = {
      en: { back: '← Back', title: 'My Orders', empty: 'You have not ordered anything yet.', home: 'Home', myOrder: 'My Orders', qty: 'Qty: ', viewBill: 'View Bill', subtotal: 'Subtotal', tax: 'Tax (5%)', total: 'Total', thankYou: 'Thank you for dining with us!', visitAgain: 'Please visit again', close: 'Close' },
      hi: { back: '← वापस', title: 'मेरा ऑर्डर', empty: 'आपने अभी तक कुछ भी ऑर्डर नहीं किया है।', home: 'होम', myOrder: 'मेरा ऑर्डर', qty: 'मात्रा: ', viewBill: 'बिल देखें', subtotal: 'उप-कुल', tax: 'कर (5%)', total: 'कुल राशि', thankYou: 'हमारे साथ भोजन करने के लिए धन्यवाद!', visitAgain: 'कृपया फिर पधारें', close: 'बंद करें' },
      mr: { back: '← मागे', title: 'माझी ऑर्डर', empty: 'तुम्ही अद्याप काहीही ऑर्डर केलेले नाही.', home: 'मुख्यपृष्ठ', myOrder: 'माझी ऑर्डर', qty: 'प्रमाण: ', viewBill: 'बिल पाहा', subtotal: 'उप-एकूण', tax: 'कर (5%)', total: 'एकूण रक्कम', thankYou: 'आमच्यासोबत जेवल्याबद्दल धन्यवाद!', visitAgain: 'कृपया पुन्हा भेट द्या', close: 'बंद करा' }
    };
    const ui = STRINGS[lang] || STRINGS.en;

    /* ── Apply translations ── */
    document.getElementById('backBtn').textContent = ui.back;
    document.getElementById('pageTitle').textContent = ui.title;
    document.getElementById('emptyState').textContent = ui.empty;
    document.getElementById('txtHome').textContent = ui.home;
    document.getElementById('txtMyOrder').textContent = ui.myOrder;
    document.getElementById('btnViewBill').textContent = ui.viewBill;
    document.getElementById('topTable').textContent = table;
    document.getElementById('txtSubtotal').textContent = ui.subtotal;
    document.getElementById('txtTax').textContent = ui.tax;
    document.getElementById('txtTotal').textContent = ui.total;
    document.getElementById('txtThankYou').textContent = ui.thankYou;
    document.getElementById('txtVisitAgain').textContent = ui.visitAgain;
    document.getElementById('closeBillBtn').textContent = ui.close;

    function passParamsToHome(e) {
      const base = 'menu.html';
      const q = new URLSearchParams({ lang, table, persons }).toString();
      e.currentTarget.href = base + '?' + q;
    }

    /* ── Load Orders ── */
    let stored = [];
    const orderKey = 'hotel_confirmed_orders_' + table;
    try { stored = JSON.parse(sessionStorage.getItem(orderKey) || '[]'); } catch (e) { }

    if (stored.length === 0) {
      document.getElementById('emptyState').style.display = 'block';
    } else {
      const listEl = document.getElementById('orderList');
      stored.forEach(item => {
        const itemName = item[lang] || item.en;
        const itemTotal = item.price * item.qty;

        const card = document.createElement('div');
        card.className = 'order-card';
        card.innerHTML = `
          <div class="order-info">
            <div class="order-name">${itemName}</div>
            <div class="order-qty">${ui.qty}${item.qty}</div>
          </div>
          <div class="order-price">₹${itemTotal}</div>
        `;
        listEl.appendChild(card);
      });
      document.getElementById('totalSection').style.display = 'flex';
    }

    /* ── Bill Logic ── */
    function getFormattedDate() {
      const d = new Date();
      const day = String(d.getDate()).padStart(2, '0');
      const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      const month = months[d.getMonth()];
      const year = d.getFullYear();
      return `${day}/ ${month}/${year}`;
    }

    const btnViewBill = document.getElementById('btnViewBill');
    const billOverlay = document.getElementById('billOverlay');
    const closeBillBtn = document.getElementById('closeBillBtn');

    if (btnViewBill) {
      btnViewBill.addEventListener('click', () => {
        let subtotal = 0;
        const billItemsContainer = document.getElementById('billItems');
        billItemsContainer.innerHTML = '';

        stored.forEach(item => {
          const itemName = item[lang] || item.en;
          const itemTotal = item.price * item.qty;
          subtotal += itemTotal;

          const row = document.createElement('div');
          row.className = 'bill-item-row';
          row.innerHTML = `
            <div class="bill-item-name">${item.qty}x ${itemName}</div>
            <div class="bill-item-price">₹${itemTotal}</div>
          `;
          billItemsContainer.appendChild(row);
        });

        const tax = Math.round(subtotal * 0.05); // 5% tax
        const total = subtotal + tax;

        document.getElementById('billSubtotal').textContent = `₹${subtotal}`;
        document.getElementById('billTax').textContent = `₹${tax}`;
        document.getElementById('billTotal').textContent = `₹${total}`;
        
        document.getElementById('billDate').textContent = getFormattedDate();
        document.getElementById('billTableNum').textContent = table;

        billOverlay.classList.add('show');
      });
    }

    if (closeBillBtn) {
      closeBillBtn.addEventListener('click', () => {
        billOverlay.classList.remove('show');
      });
    }
  </script>
</body>
</html>
